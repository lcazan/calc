        // === EVENT 4: Obstacle Course / Gauntlet ===
        function startObstacleCourse() {
            isObstacleCourse = true;
            obstacleCourseTimer = pickGauntletDuration();
            // Short gauntlets (<=10s) read as a sparse "pegboard" of
            // individual rocks to weave around; long ones (45s) are a full
            // packed corridor. This factor blends smoothly between them —
            // used by spawnGauntletRow() below.
            gauntletCorridorFactor = Math.max(0, Math.min(1, (obstacleCourseTimer - 10) / 35));
            // Guarantee at least 3 full ship-widths of clear passage, plus a
            // buffer to absorb the per-rock position/size jitter below.
            // Narrowed by roughly one rock-width from the previous version —
            // still a hard floor of well over 2 ship-widths.
            const minGap = player.radius * 2 * 2.5 + 30;
            corridorGapWidth = Math.max(minGap, Math.min(canvas.width * 0.28, canvas.width - 200) - GAUNTLET_ROCK_H_SPACING);
            livesAtCourseStart = player.lives;
            // Don't wipe existing asteroids/bullets — they keep falling/flying
            // naturally and clear off-screen on their own. Spawning of NEW
            // regular asteroids is paused elsewhere while isObstacleCourse
            // is true. The gauntlet itself is built from indestructible rock
            // asteroids pushed into the same `asteroids` array — spawned row
            // by row just above the top edge and left to scroll down and
            // clear naturally, exactly like normal asteroids.
            pathSection = null;
            gauntletLastCX = canvas.width / 2;
            gauntletRowTimer = 0;
            gauntletRowIndex = 0;

            // Perfect-clear streak for Photon Torpedoes: any regular
            // (destructible) asteroid still standing when the gauntlet
            // begins was never actually destroyed by the player, so it
            // breaks the streak, same as one that slipped off-screen.
            if (asteroids.some(a => !a.indestructible)) intervalPerfectClear = false;

            let unlockedTorpedoes = false;
            if (intervalPerfectClear && intervalAsteroidsSpawned > 0 && !hasPhotonTorpedoes) {
                hasPhotonTorpedoes = true;
                unlockedTorpedoes = true;
            }
            intervalPerfectClear = true;
            intervalAsteroidsSpawned = 0;

            // Clear out any regular asteroids still in flight from before the
            // trigger — otherwise they linger near the top and stack with
            // the new gauntlet rocks, making the entrance look far denser
            // than the rest of the course.
            asteroids = asteroids.filter(a => a.indestructible);

            warningText.textContent = unlockedTorpedoes
                ? '🚀 PHOTON TORPEDOES UNLOCKED — PERMANENT MISSILE UPGRADE!'
                : '⚠️ ASTEROID GAUNTLET! NAVIGATE THE CORRIDOR!';
            waveWarning.classList.remove('hidden');
            setTimeout(() => waveWarning.classList.add('hidden'), 3200);
        }

        // Weighted gauntlet duration: mostly short "pegboard" bursts, with
        // longer full corridors increasingly rare.
        function pickGauntletDuration() {
            const r = Math.random();
            if (r < 0.6) return 5 + Math.random() * 5;     // 5-10s (60%)
            if (r < 0.9) return 10 + Math.random() * 20;    // 10-30s (30% — half as common)
            return 30 + Math.random() * 15;                  // 30-45s (10% — rarer still)
        }

        // Picks the next "road section" behavior, mimicking an overhead
        // driving-road game: alternating stretches of straight road, gentle
        // drifts, sharp zigzags, and big full-width transitions.
        function pickPathSection() {
            // Weighted so straight, do-nothing stretches are less common
            // and shorter — the corridor should read as "winding with
            // occasional straight breathers", not "mostly straight".
            const types = ['zigzag', 'zigzag', 'drift', 'bigturn', 'straight'];
            const type = types[Math.floor(Math.random() * types.length)];
            const dir = Math.random() < 0.5 ? 1 : -1;
            let segmentsLeft, stepAmount, alternate = false;

            // Scale turn sharpness to the actual gap width so a turn can
            // never out-pace the passage itself. Capping each row's shift
            // well under the gap width guarantees consecutive rows' gaps
            // overlap by a wide margin — no zigzag chicane narrower than
            // the ship can fit through.
            const unit = corridorGapWidth * 0.22;

            switch (type) {
                case 'straight':
                    segmentsLeft = 2 + Math.floor(Math.random() * 2); // 2-3 segments, no drift
                    stepAmount = 0;
                    break;
                case 'drift':
                    segmentsLeft = 4 + Math.floor(Math.random() * 3); // 4-6 segments
                    stepAmount = unit * (0.35 + Math.random() * 0.3);   // gentle, same direction
                    break;
                case 'zigzag':
                    segmentsLeft = 5 + Math.floor(Math.random() * 4); // 5-8 segments
                    stepAmount = unit * (0.55 + Math.random() * 0.3);   // flips every segment, still gentle per-row
                    alternate = true;
                    break;
                case 'bigturn':
                    segmentsLeft = 4 + Math.floor(Math.random() * 2); // 4-5 segments
                    stepAmount = unit * (0.5 + Math.random() * 0.3);    // sustained but gradual sweep
                    break;
            }
            return { type, segmentsLeft, dir, stepAmount, alternate };
        }

        // Computes the next segment's center-x based on the current road
        // section's behavior, advancing/rotating sections as they run out.
        function nextCorridorCX(prevCX) {
            if (!pathSection || pathSection.segmentsLeft <= 0) pathSection = pickPathSection();

            const shift = pathSection.stepAmount * pathSection.dir;
            if (pathSection.alternate) pathSection.dir *= -1; // zigzag flips each step
            pathSection.segmentsLeft--;

            const bound = corridorGapWidth / 2 + 45;
            return Math.max(bound, Math.min(canvas.width - bound, prevCX + shift));
        }

        function spawnGauntletRow(yOffset) {
            gauntletLastCX = nextCorridorCX(gauntletLastCX);
            const f = gauntletCorridorFactor; // 0 = pegboard, 1 = full corridor

            // Blend the "protected" open gap and rock spacing/density by
            // duration: at f=0 the gap collapses to nothing, so rocks are
            // considered across the FULL width, and with wide spacing plus
            // a low fill chance that reads as a sparse pegboard to weave
            // through rather than a defined lane. At f=1 it's the normal
            // dense two-wall corridor with a real protected gap.
            const gap = corridorGapWidth * f;
            const spacing = 170 - (170 - GAUNTLET_ROCK_H_SPACING) * f;
            const fillChance = 0.3 + 0.7 * f;

            const leftWall = gauntletLastCX - gap / 2;
            const rightWall = gauntletLastCX + gap / 2;
            // yOffset (defaults to 0) nudges this row further along its fall
            // in case the catch-up loop below ever spawns more than one row
            // in the same frame — guarantees no two rows can ever land on
            // the exact same y and visually double up.
            const y = -GAUNTLET_ROCK_RADIUS - 10 - (yOffset || 0);
            gauntletRowIndex++;
            const stagger = (gauntletRowIndex % 2 === 0) ? 0 : spacing / 2;

            const makeRock = (x, yy) => {
                const numVertices = 7 + Math.floor(Math.random() * 4);
                const offsetAngles = Array(numVertices).fill(0).map(() => 0.7 + Math.random() * 0.6);
                asteroids.push({
                    x: x + (Math.random() - 0.5) * 4,
                    y: yy + (Math.random() - 0.5) * 10,
                    radius: GAUNTLET_ROCK_RADIUS + (Math.random() - 0.5) * 4,
                    vx: 0,
                    vy: GAUNTLET_SCROLL_SPEED,
                    rotation: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 1.2,
                    hp: 1,
                    maxHp: 1,
                    points: 0,
                    numVertices,
                    offsetAngles,
                    indestructible: true
                });
            };

            for (let x = GAUNTLET_ROCK_RADIUS + stagger; x <= leftWall - GAUNTLET_ROCK_RADIUS; x += spacing) {
                if (Math.random() < fillChance) makeRock(x, y);
            }
            for (let x = rightWall + GAUNTLET_ROCK_RADIUS + stagger; x <= canvas.width - GAUNTLET_ROCK_RADIUS; x += spacing) {
                if (Math.random() < fillChance) makeRock(x, y);
            }

            // Only in corridor-ish territory: every now and then drop a
            // single rock out in the open gap itself — forces a left/right
            // choice through wide sections instead of just flying straight
            // down the middle — while always leaving a lane on the other
            // side comfortably wider than the ship. (At low f, the row loop
            // above already scatters rocks across the whole width, so this
            // island trick is redundant there.)
            const minPassGap = player.radius * 2 * 2.2 + 20;
            if (f > 0.5 && gap > minPassGap * 2 + GAUNTLET_ROCK_RADIUS * 2 && Math.random() < 0.16) {
                const islandR = GAUNTLET_ROCK_RADIUS - 2 + Math.random() * 4;
                const nearLeft = Math.random() < 0.5;
                const islandX = nearLeft
                    ? leftWall + islandR + 14 + Math.random() * 14
                    : rightWall - islandR - 14 - Math.random() * 14;
                makeRock(islandX, y);
            }
        }

        function updateObstacleCourse(dt, speedMultiplier) {
            obstacleCourseTimer -= dt;

            // Spawn new rows of wall rocks just above the top edge as time
            // passes — they then fall and clear the screen through the
            // exact same movement/collision/cleanup code as any other
            // asteroid (see the main asteroid update loop). The spawn
            // cadence is scaled by the same slow-motion multiplier as the
            // rocks' own fall speed, so rows stay evenly spaced on screen
            // instead of bunching up when the Slow powerup is active.
            // Rows are also spaced further apart vertically at low
            // gauntletCorridorFactor, so short pegboard-style gauntlets
            // read as a genuinely sparse field, not just a thinner corridor.
            const rowSpacing = 190 - (190 - GAUNTLET_ROW_SPACING) * gauntletCorridorFactor;
            const rowInterval = rowSpacing / GAUNTLET_SCROLL_SPEED;
            gauntletRowTimer += dt * speedMultiplier;
            while (gauntletRowTimer >= rowInterval) {
                gauntletRowTimer -= rowInterval;
                spawnGauntletRow(gauntletRowTimer * GAUNTLET_SCROLL_SPEED);
            }

            // End of gauntlet (new rows stop spawning; existing rocks scroll off naturally)
            if (obstacleCourseTimer <= 0) endObstacleCourse();
        }

        function endObstacleCourse() {
            isObstacleCourse = false;
            pathSection = null;
            nextObstacleCourseTime = eventClock + 60 + Math.random() * 60; // next one in 1-2 min

            const survived = player.lives >= livesAtCourseStart;
            if (survived) {
                if (player.maxLives < 5) {
                    // First time reaching max hearts — celebrate it.
                    player.maxLives = 5;
                    player.lives = player.maxLives;
                    updateLivesUI();
                    sfx.playGauntletSuccess();
                    warningText.textContent = '🎁 GAUNTLET CLEARED! MAX HEARTS UPGRADED TO 5!';
                    waveWarning.classList.remove('hidden');
                    setTimeout(() => waveWarning.classList.add('hidden'), 3200);
                } else if (player.lives < player.maxLives) {
                    // Already upgraded before — just top hearts off quietly.
                    player.lives = player.maxLives;
                    updateLivesUI();
                }
            } else {
                warningText.textContent = '💔 GAUNTLET FAILED — HEARTS LOST!';
                waveWarning.classList.remove('hidden');
                setTimeout(() => waveWarning.classList.add('hidden'), 3200);
            }
        }

        // ---- Alien Ship: once a minute, shoot it down or lose the game ----

        function spawnAlienShip() {
            if (motherShip) return; // mothership fights are exclusive
            alienWaveCount = Math.min(3, alienWaveCount + 1);
            for (let i = 0; i < alienWaveCount; i++) {
                alienShips.push({
                    x: canvas.width * (0.2 + Math.random() * 0.6),
                    y: -50 - i * 80,
                    radius: 32,
                    hp: ALIEN_SHIP_HP,
                    maxHp: ALIEN_SHIP_HP,
                    wobble: Math.random() * Math.PI * 2,
                    hitFlashTimer: 0,
                    shootTimer: 0.6 + Math.random() * 0.8
                });
            }
            warningText.textContent = alienWaveCount > 1
                ? `🛸 ${alienWaveCount} ALIEN SHIPS INBOUND — SHOOT THEM DOWN!`
                : '🛸 ALIEN SHIP INBOUND — SHOOT IT DOWN!';
            waveWarning.classList.remove('hidden');
            setTimeout(() => waveWarning.classList.add('hidden'), 3200);
        }

        // Applies damage to a regular alien ship and handles its destruction
        // (score, explosion, removal, scheduling the next wave). Used by
        // every damage source — bullets, missiles, FAN-5, ramming.
        function damageAlienShip(ship, dmg, flashColor) {
            ship.hp -= dmg;
            ship.hitFlashTimer = Math.max(ship.hitFlashTimer, 0.2);
            createExplosion(ship.x, ship.y, flashColor || '#4ade80', 8);
            if (ship.hp <= 0) {
                createExplosion(ship.x, ship.y, '#a3e635', 26);
                sfx.playExplosion(true);
                addScore(150);
                const idx = alienShips.indexOf(ship);
                if (idx >= 0) alienShips.splice(idx, 1);
                nextAlienShipTime = alienClock + 60;
            }
        }

        // A full "hit" — pops the whole shield, or costs one full heart.
        // Used for ramming/collision-style damage.
        function applyPlayerDamage(amount, srcX, srcY) {
            if (player.invulnerableTimer > 0) return;
            player.collisionFlashTimer = COLLISION_FLASH_DURATION;
            if (player.powerups.shield > 0) {
                player.powerups.shield = 0;
                player.shieldCharge = 0;
                player.invulnerableTimer = 1.0;
                createExplosion(player.x, player.y, '#38bdf8', 14);
                sfx.playHit();
            } else {
                player.lives -= amount;
                updateLivesUI();
                createExplosion(player.x, player.y, '#ef4444', 20);
                sfx.playHit();
                player.invulnerableTimer = 1.5;
                if (player.lives <= 0) { gameOver(); }
            }
        }

        // A half hit — from an alien bullet. Shield absorbs two of these
        // before breaking; otherwise costs half a heart.
        function applyEnemyBulletDamage() {
            if (player.invulnerableTimer > 0) return;
            player.collisionFlashTimer = COLLISION_FLASH_DURATION;
            if (player.powerups.shield > 0 && player.shieldCharge > 0) {
                player.shieldCharge -= 0.5;
                createExplosion(player.x, player.y, '#38bdf8', 8);
                sfx.playHit();
                if (player.shieldCharge <= 0.001) {
                    player.shieldCharge = 0;
                    player.powerups.shield = 0;
                }
                player.invulnerableTimer = 0.25;
            } else {
                player.lives -= 0.5;
                updateLivesUI();
                createExplosion(player.x, player.y, '#ef4444', 10);
                sfx.playHit();
                player.invulnerableTimer = 0.4;
                if (player.lives <= 0) { gameOver(); }
            }
        }

        function updateEnemyBullets(dt) {
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i];
                b.x += b.vx * dt;
                b.y += b.vy * dt;

                if (Math.hypot(b.x - player.x, b.y - player.y) < b.radius + player.radius) {
                    applyEnemyBulletDamage();
                    enemyBullets.splice(i, 1);
                    if (!isPlaying) return;
                    continue;
                }

                if (b.x < -20 || b.x > canvas.width + 20 || b.y < -20 || b.y > canvas.height + 20) {
                    enemyBullets.splice(i, 1);
                }
            }
        }

        function renderEnemyBullets() {
            enemyBullets.forEach(b => {
                ctx.save();
                ctx.shadowColor = b.color;
                ctx.shadowBlur = 10;
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function updateAlienShips(dt) {
            if (alienShips.length === 0 && !isObstacleCourse && !motherShip && alienClock >= nextAlienShipTime) {
                spawnAlienShip();
            }

            for (let s = alienShips.length - 1; s >= 0; s--) {
                const ship = alienShips[s];

                ship.wobble += dt * 1.5;
                ship.x += Math.sin(ship.wobble) * 45 * dt;
                ship.x = Math.max(ship.radius, Math.min(canvas.width - ship.radius, ship.x));
                ship.y += ALIEN_SHIP_SPEED * dt;

                if (ship.hitFlashTimer > 0) ship.hitFlashTimer -= dt;

                // Keep the ship's hull clear of asteroids, and it takes real
                // damage for smashing into them — destructible ones explode
                // on contact, and rocks it can't destroy get shoved out to
                // its edge (each rock only damages it once).
                for (let k = asteroids.length - 1; k >= 0; k--) {
                    const a = asteroids[k];
                    const dx = a.x - ship.x, dy = a.y - ship.y;
                    const dist = Math.hypot(dx, dy);
                    const minDist = a.radius + ship.radius;
                    if (dist >= minDist) continue;

                    if (!a._hitAlienShip) {
                        a._hitAlienShip = true;
                        const dmg = Math.max(1, Math.round(a.radius / 8));
                        damageAlienShip(ship, dmg, '#f97316');
                        if (ship.hp <= 0) break;
                    }

                    if (a.indestructible) {
                        const nx = dist > 0 ? dx / dist : 0, ny = dist > 0 ? dy / dist : -1;
                        a.x = ship.x + nx * minDist;
                        a.y = ship.y + ny * minDist;
                    } else {
                        createExplosion(a.x, a.y, '#94a3b8', Math.floor(a.radius / 2));
                        asteroids.splice(k, 1);
                    }
                }
                if (ship.hp <= 0) continue; // destroyed above, already removed from array

                // Reaches the bottom edge = Earth is defenseless. Game over, no matter how many hearts remain.
                if (ship.y - ship.radius > canvas.height) {
                    gameOver('alien');
                    return;
                }

                // Ramming it costs you a hit (shield/heart), but only weapons destroy it.
                const distToPlayer = Math.hypot(ship.x - player.x, ship.y - player.y);
                if (distToPlayer < ship.radius + player.radius && player.invulnerableTimer <= 0) {
                    applyPlayerDamage(1, ship.x, ship.y);
                    if (!isPlaying) return;
                }

                // Bullets vs this alien ship
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    const dist = Math.hypot(ship.x - b.x, ship.y - b.y);
                    if (dist < ship.radius + b.radius) {
                        bullets.splice(j, 1);
                        damageAlienShip(ship, 1, '#4ade80');
                        break;
                    }
                }
                if (ship.hp <= 0) continue;

                // Fires at the player, ~once per second
                ship.shootTimer -= dt;
                if (ship.shootTimer <= 0) {
                    ship.shootTimer = 1.0;
                    const ang = Math.atan2(player.y - ship.y, player.x - ship.x);
                    enemyBullets.push({
                        x: ship.x, y: ship.y,
                        vx: Math.cos(ang) * ALIEN_BULLET_SPEED,
                        vy: Math.sin(ang) * ALIEN_BULLET_SPEED,
                        radius: 5,
                        color: '#4ade80'
                    });
                    sfx.playShoot();
                }
            }
        }

        function renderAlienShips() {
            alienShips.forEach(ship => renderOneAlienShip(ship));
        }

        function renderOneAlienShip(ship) {
            const hpFrac = Math.max(0, ship.hp / ship.maxHp);
            // Green when healthy, sliding through yellow to red as it's whittled down
            const hullColor = `hsl(${Math.round(130 * hpFrac)}, 65%, 34%)`;
            const domeColor  = `hsl(${Math.round(130 * hpFrac)}, 75%, 58%)`;
            const glowColor  = `hsl(${Math.round(130 * hpFrac)}, 80%, 50%)`;

            ctx.save();
            ctx.translate(ship.x, ship.y);

            // Solid hull — color reflects remaining health
            ctx.fillStyle = hullColor;
            ctx.strokeStyle = '#0f2417';
            ctx.lineWidth = 2;
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.ellipse(0, 0, ship.radius, ship.radius * 0.55, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Dome
            ctx.fillStyle = domeColor;
            ctx.beginPath();
            ctx.arc(0, -ship.radius * 0.25, ship.radius * 0.4, Math.PI, 0);
            ctx.fill();
            ctx.stroke();

            // A little alien pilot visible inside the dome
            ctx.fillStyle = '#166534';
            ctx.beginPath();
            ctx.ellipse(0, -ship.radius * 0.32, ship.radius * 0.15, ship.radius * 0.2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#0a0a0a';
            ctx.beginPath();
            ctx.ellipse(-ship.radius * 0.06, -ship.radius * 0.35, ship.radius * 0.045, ship.radius * 0.06, 0, 0, Math.PI * 2);
            ctx.ellipse(ship.radius * 0.06, -ship.radius * 0.35, ship.radius * 0.045, ship.radius * 0.06, 0, 0, Math.PI * 2);
            ctx.fill();

            // Hit flash — bright white overlay that quickly fades
            if (ship.hitFlashTimer > 0) {
                ctx.save();
                ctx.globalAlpha = Math.min(1, ship.hitFlashTimer / 0.25) * 0.9;
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.ellipse(0, 0, ship.radius * 1.15, ship.radius * 0.65, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            ctx.restore();

            // HP bar
            const barW = 60, barH = 6;
            const bx = ship.x - barW / 2, by = ship.y - ship.radius - 16;
            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(bx, by, barW, barH);
            ctx.fillStyle = glowColor;
            ctx.fillRect(bx, by, barW * hpFrac, barH);
            ctx.restore();
        }

        // ---- Alien Mothership ----

        function spawnMotherShip() {
            // Force-clear the board — mothership fights are exclusive
            isObstacleCourse = false;
            asteroids = [];
            alienShips = [];
            motherShip = {
                x: canvas.width / 2,
                y: 130,
                radius: 90,
                hp: MOTHER_SHIP_HP,
                maxHp: MOTHER_SHIP_HP,
                hitFlashTimer: 0,
                shootTimer: 1
            };
            warningText.textContent = '🛸 ALIEN MOTHERSHIP DETECTED — ALL HANDS TO BATTLE STATIONS!';
            waveWarning.classList.remove('hidden');
            setTimeout(() => waveWarning.classList.add('hidden'), 4000);
        }

        function damageMotherShip(dmg) {
            if (!motherShip) return;
            motherShip.hp -= dmg;
            motherShip.hitFlashTimer = Math.max(motherShip.hitFlashTimer, 0.2);
            createExplosion(motherShip.x, motherShip.y, '#4ade80', 10);
            if (motherShip.hp <= 0) {
                const mx = motherShip.x, my = motherShip.y;
                createExplosion(mx, my, '#a3e635', 60);
                sfx.playExplosion(true);
                addScore(5000);
                motherShipsDestroyed++;
                if (motherShipsDestroyed === 2) {
                    player.maxLives = 7;
                    player.lives = 7;
                    updateLivesUI();
                    warningText.textContent = '❤️ TWO MOTHERSHIPS DESTROYED — MAX HEARTS NOW 7!';
                    waveWarning.classList.remove('hidden');
                    setTimeout(() => waveWarning.classList.add('hidden'), 3200);
                }
                motherShip = null;
                nextMotherShipTime = alienClock + 240 + Math.random() * 120;

                // Rare: ~1 in 5 mothership kills splits into 3 regular alien ships
                if (Math.random() < 0.2) {
                    for (let i = 0; i < 3; i++) {
                        alienShips.push({
                            x: Math.max(40, Math.min(canvas.width - 40, mx + (i - 1) * 70)),
                            y: my,
                            radius: 30,
                            hp: ALIEN_SHIP_HP,
                            maxHp: ALIEN_SHIP_HP,
                            wobble: Math.random() * Math.PI * 2,
                            hitFlashTimer: 0,
                            shootTimer: 1 + Math.random()
                        });
                    }
                    warningText.textContent = '🛸 THE MOTHERSHIP SPLIT INTO 3 SHIPS!';
                    waveWarning.classList.remove('hidden');
                    setTimeout(() => waveWarning.classList.add('hidden'), 3000);
                }
            }
        }

        function updateMotherShip(dt) {
            if (!motherShip) {
                if (alienShips.length === 0 && !isObstacleCourse && alienClock >= nextMotherShipTime) {
                    spawnMotherShip();
                }
                return;
            }

            if (motherShip.hitFlashTimer > 0) motherShip.hitFlashTimer -= dt;

            // Bullets vs mothership
            for (let j = bullets.length - 1; j >= 0; j--) {
                const b = bullets[j];
                if (Math.hypot(motherShip.x - b.x, motherShip.y - b.y) < motherShip.radius + b.radius) {
                    bullets.splice(j, 1);
                    damageMotherShip(1);
                    if (!motherShip) break;
                }
            }
            if (!motherShip) return;

            // Fires an aimed shot at the player's current position, ~once per second
            motherShip.shootTimer -= dt;
            if (motherShip.shootTimer <= 0) {
                motherShip.shootTimer = 1.0;
                const ang = Math.atan2(player.y - motherShip.y, player.x - motherShip.x);
                enemyBullets.push({
                    x: motherShip.x, y: motherShip.y + motherShip.radius * 0.4,
                    vx: Math.cos(ang) * ALIEN_BULLET_SPEED * 1.15,
                    vy: Math.sin(ang) * ALIEN_BULLET_SPEED * 1.15,
                    radius: 7,
                    color: '#a3e635'
                });
                sfx.playShoot();
            }
        }

        function renderMotherShip() {
            if (!motherShip) return;
            const hpFrac = Math.max(0, motherShip.hp / motherShip.maxHp);
            const hullColor = `hsl(${Math.round(130 * hpFrac)}, 55%, 30%)`;
            const domeColor  = `hsl(${Math.round(130 * hpFrac)}, 70%, 55%)`;
            const glowColor  = `hsl(${Math.round(130 * hpFrac)}, 80%, 50%)`;

            ctx.save();
            ctx.translate(motherShip.x, motherShip.y);

            ctx.fillStyle = hullColor;
            ctx.strokeStyle = '#0f2417';
            ctx.lineWidth = 3;
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.ellipse(0, 0, motherShip.radius, motherShip.radius * 0.45, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Hull ridges
            ctx.strokeStyle = 'rgba(0,0,0,0.35)';
            ctx.lineWidth = 2;
            for (let i = -2; i <= 2; i++) {
                ctx.beginPath();
                ctx.moveTo(i * motherShip.radius * 0.32, -motherShip.radius * 0.3);
                ctx.lineTo(i * motherShip.radius * 0.32, motherShip.radius * 0.3);
                ctx.stroke();
            }

            // Big dome with several alien pilots visible inside
            ctx.fillStyle = domeColor;
            ctx.beginPath();
            ctx.arc(0, -motherShip.radius * 0.2, motherShip.radius * 0.42, Math.PI, 0);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#166534';
            for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.ellipse(i * motherShip.radius * 0.16, -motherShip.radius * 0.28, motherShip.radius * 0.1, motherShip.radius * 0.13, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = '#0a0a0a';
            for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.ellipse(i * motherShip.radius * 0.16 - motherShip.radius * 0.035, -motherShip.radius * 0.3, motherShip.radius * 0.03, motherShip.radius * 0.04, 0, 0, Math.PI * 2);
                ctx.ellipse(i * motherShip.radius * 0.16 + motherShip.radius * 0.035, -motherShip.radius * 0.3, motherShip.radius * 0.03, motherShip.radius * 0.04, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            if (motherShip.hitFlashTimer > 0) {
                ctx.save();
                ctx.globalAlpha = Math.min(1, motherShip.hitFlashTimer / 0.25) * 0.85;
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 40;
                ctx.beginPath();
                ctx.ellipse(0, 0, motherShip.radius * 1.1, motherShip.radius * 0.55, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            ctx.restore();

            // HP bar
            const barW = 220, barH = 10;
            const bx = motherShip.x - barW / 2, by = motherShip.y - motherShip.radius - 24;
            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.fillRect(bx, by, barW, barH);
            ctx.fillStyle = glowColor;
            ctx.fillRect(bx, by, barW * hpFrac, barH);
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.strokeRect(bx, by, barW, barH);
            ctx.restore();
        }

        // ---- Render Helpers for new features ----

        function renderGauntletHUD() {
            // No walls, no tint here — the gauntlet's boundaries are the
            // rock asteroids themselves (rendered in the normal asteroid
            // pass, in a distinct color). This just shows the countdown.
            const secs = Math.ceil(obstacleCourseTimer);
            ctx.save();
            ctx.textAlign = 'center';
            ctx.font = 'bold 19px monospace';
            ctx.shadowBlur = 12;
            ctx.shadowColor = secs <= 5 ? '#ef4444' : '#f97316';
            ctx.fillStyle  = secs <= 5 ? '#fca5a5' : '#fdba74';
            ctx.fillText(`⚡ GAUNTLET: ${secs}s`, canvas.width / 2, 76);
            ctx.restore();
        }

        function renderChestReward() {
            if (chestRewardTimer <= 0) return;
            const alpha = Math.min(1, chestRewardTimer);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2 - 50;
            const t  = Date.now() / 1000;
            const bob = Math.sin(t * 2.5) * 6;

            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(cx, cy + bob);

            // Glow halo
            const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 140);
            grad.addColorStop(0, 'rgba(251,191,36,0.25)');
            grad.addColorStop(1, 'rgba(251,191,36,0)');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(0, 0, 140, 0, Math.PI * 2); ctx.fill();

            // Chest body
            ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 22;
            ctx.fillStyle = '#92400e';
            ctx.fillRect(-50, 8, 100, 58);

            // Lid
            ctx.fillStyle = '#b45309';
            ctx.fillRect(-50, -26, 100, 36);

            // Lid arc top
            ctx.beginPath();
            ctx.ellipse(0, -26, 50, 14, 0, Math.PI, 0);
            ctx.fill();

            // Gold band
            ctx.fillStyle = '#fbbf24'; ctx.shadowBlur = 8;
            ctx.fillRect(-50, 4, 100, 8);

            // Lock body
            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(-9, 12, 18, 14);
            ctx.beginPath(); ctx.arc(0, 12, 9, Math.PI, 0); ctx.fill();
            // Lock keyhole
            ctx.fillStyle = '#92400e';
            ctx.beginPath(); ctx.arc(0, 14, 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillRect(-2, 16, 4, 7);

            // Orbit sparkles
            ctx.shadowBlur = 10;
            for (let i = 0; i < 8; i++) {
                const a = (i / 8) * Math.PI * 2 + t * 1.6;
                const r = 80 + Math.sin(t * 3 + i) * 12;
                const sx = Math.cos(a) * r, sy = Math.sin(a) * r * 0.6;
                const sz = 2 + Math.sin(t * 4 + i * 1.3) * 1.5;
                ctx.fillStyle = i % 2 === 0 ? '#fbbf24' : '#f9a8d4';
                ctx.beginPath(); ctx.arc(sx, sy, sz, 0, Math.PI * 2); ctx.fill();
            }

            ctx.restore();

            // Text labels (outside translate so they stay fixed)
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.textAlign = 'center';
            ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 14;
            ctx.fillStyle = '#fef08a';
            ctx.font = 'bold 26px sans-serif';
            ctx.fillText('🎁 HULL UPGRADE!', cx, cy + bob - 60);
            ctx.font = 'bold 16px sans-serif';
            ctx.fillStyle = '#fca5a5';
            ctx.shadowColor = '#ef4444';
            ctx.fillText('MAX HEARTS: ❤️❤️❤️❤️❤️', cx, cy + bob + 90);
            ctx.font = '13px sans-serif';
            ctx.fillStyle = '#d1fae5'; ctx.shadowColor = '#34d399'; ctx.shadowBlur = 8;
            ctx.fillText('+2 hearts added to hull!', cx, cy + bob + 113);
            ctx.restore();
        }

        function renderFallingHearts() {
            fallingHearts.forEach(h => {
                const pulse = 1 + 0.15 * Math.sin(h.wobble * 4 + Date.now() / 200);
                ctx.save();
                ctx.translate(h.x, h.y);
                ctx.scale(pulse, pulse);

                // Speed trail
                ctx.globalAlpha = 0.25;
                ctx.fillStyle = '#ef4444';
                for (let i = 1; i <= 4; i++) {
                    ctx.save();
                    ctx.translate(0, i * 14);
                    ctx.globalAlpha = 0.25 - i * 0.05;
                    drawHeartShape(ctx, 10 - i * 0.5);
                    ctx.fill();
                    ctx.restore();
                }

                // Main heart
                ctx.globalAlpha = 1;
                ctx.fillStyle = '#ef4444';
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 18;
                drawHeartShape(ctx, 12);
                ctx.fill();

                // Inner bright core
                ctx.fillStyle = '#fecaca';
                ctx.shadowBlur = 6;
                drawHeartShape(ctx, 6);
                ctx.fill();

                ctx.restore();
            });
        }

        function drawHeartShape(ctx, s) {
            // Two-circle + rotated-square heart (reliable cross-browser)
            const r = s * 0.72;
            ctx.beginPath();
            ctx.arc(-r, -r * 0.3, r, 0, Math.PI * 2);
            ctx.arc( r, -r * 0.3, r, 0, Math.PI * 2);
            ctx.save();
            ctx.rotate(Math.PI / 4);
            ctx.rect(-s, -s, s * 2, s * 2);
            ctx.restore();
        }

        function addScore(pts) {
            score += pts;
            scoreDisplay.textContent = score;

            // Earn 1 laser charge every 300 points, alternating which weapon gets it
            if (score >= lastLaserThreshold + 300) {
                const earned = Math.floor((score - lastLaserThreshold) / 300);
                for (let i = 0; i < earned; i++) {
                    if (nextLaserGrantIsChain) chainLaserCharges++; else fanLaserCharges++;
                    nextLaserGrantIsChain = !nextLaserGrantIsChain;
                }
                lastLaserThreshold += earned * 300;
                sfx.playPowerup();
                updateChainLaserUI();
                updateFanLaserUI();
            }
        }

        function updateChainLaserUI() {
            chainBadge.textContent = chainLaserCharges;
            if (chainLaserCharges > 0) chainLaserBtn.classList.remove('hidden');
            else chainLaserBtn.classList.add('hidden');
        }

        function updateFanLaserUI() {
            fanBadge.textContent = fanLaserCharges;
            if (fanLaserCharges > 0) crossLaserBtn.classList.remove('hidden');
            else crossLaserBtn.classList.add('hidden');
        }

        function spawnAsteroid() {
            const sizeCategory = Math.random();
            let radius, hp;

            if (sizeCategory > 0.7) {
                radius = 36 + Math.random() * 12;
                hp = 3;
            } else if (sizeCategory > 0.35) {
                radius = 22 + Math.random() * 8;
                hp = 2;
            } else {
                radius = 12 + Math.random() * 6;
                hp = 1;
            }

            const numVertices = 7 + Math.floor(Math.random() * 5);
            const offsetAngles = [];
            for (let i = 0; i < numVertices; i++) {
                offsetAngles.push(0.7 + Math.random() * 0.6);
            }

            // ~18% of regular falling asteroids are indestructible — same
            // rust/orange rocks as the gauntlet walls — so bullets alone
            // never guarantee a clear path even outside the gauntlet.
            const indestructible = Math.random() < 0.18;

            asteroids.push({
                x: Math.random() * (canvas.width - radius * 2) + radius,
                y: -radius - 10,
                radius: radius,
                vx: (Math.random() - 0.5) * 60,
                vy: Math.random() * 80 + 80 + (score / 1000) * 10,
                rotation: 0,
                vRot: (Math.random() - 0.5) * 2,
                hp: indestructible ? 1 : hp,
                maxHp: indestructible ? 1 : hp,
                points: 10,
                numVertices: numVertices,
                offsetAngles: offsetAngles,
                indestructible: indestructible
            });

            if (!indestructible) intervalAsteroidsSpawned++;
        }

        function createExplosion(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 220 + 30;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3.5 + 1,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 1.5 + 1
                });
            }
        }

        function spawnPowerup(x, y) {
            // Missile now drops ~3x as often as before (1/3 of drops)
            const types = ['rapid', 'spread', 'shield', 'slow', 'missile', 'missile'];
            const type = types[Math.floor(Math.random() * types.length)];
            powerups.push({
                x: x,
                y: y,
                type: type,
                radius: 14,
                vy: 90
            });
        }

        function triggerMissile() {
            if (!isPlaying || isPaused || missileStock <= 0) return;

            missileStock--;
            updateMissileUI();

            // Pick the nearest alien target (regular ship or mothership) to home in on
            let target = null, bestDist = Infinity;
            alienShips.forEach(s => {
                const d = Math.hypot(s.x - player.x, s.y - player.y);
                if (d < bestDist) { bestDist = d; target = s; }
            });
            if (motherShip) {
                const d = Math.hypot(motherShip.x - player.x, motherShip.y - player.y);
                if (d < bestDist) { bestDist = d; target = motherShip; }
            }

            missiles.push({
                x: player.x,
                y: player.y - player.radius,
                angle: -Math.PI / 2, // heading, radians (0 = right, -PI/2 = up)
                speed: 380,
                radius: 6,
                target: target, // homes in on the nearest alien target, if any, when fired
                isTorpedo: hasPhotonTorpedoes // permanent upgrade, baked in at fire time
            });
            sfx.playShoot();
        }

        function updateMissileUI() {
            missileBadge.textContent = missileStock;
            if (missileStock > 0) {
                missileBtn.classList.remove('hidden');
            } else {
                missileBtn.classList.add('hidden');
            }
        }

        function fireBullet() {
            const isRapid = player.powerups.rapid > 0;
            const isSpread = player.powerups.spread > 0;

            const speed = 750;
            if (isSpread) {
                const angles = [-0.22, 0, 0.22];
                angles.forEach(angle => {
                    bullets.push({
                        x: player.x,
                        y: player.y - player.radius,
                        vx: Math.sin(angle) * speed,
                        vy: -Math.cos(angle) * speed,
                        radius: 3,
                        color: '#38bdf8'
                    });
                });
            } else {
                bullets.push({
                    x: player.x,
                    y: player.y - player.radius,
                    vx: 0,
                    vy: -speed,
                    radius: 3.5,
                    color: isRapid ? '#f43f5e' : '#38bdf8'
                });
            }
            sfx.playShoot();
        }

        function update(dt) {
            // Update Screen Shake & Anim Timers
            if (screenShake > 0) screenShake -= dt;
            if (chainLaserAnimTimer > 0) chainLaserAnimTimer -= dt;
            if (crossLaserAnimTimer > 0) crossLaserAnimTimer -= dt;

            // Starfield
            stars.forEach(star => {
                star.y += star.speed * dt;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });

            if (!isPlaying || isPaused) return;

            // Wave Events Timeline Check
            if (!isObstacleCourse && !motherShip) eventClock += dt;

            if (!isObstacleCourse && !motherShip) {
                if (eventClock >= nextCrossfireEventTime) {
                    triggerCrossfireStorm();
                    nextCrossfireEventTime += 60;
                }
                if (eventClock >= nextWallEventTime) {
                    triggerAsteroidWallWave();
                    nextWallEventTime += 60;
                }
            }

            // Falling Heart Drops (random every 1-1.5 min)
            if (!isObstacleCourse && !motherShip && eventClock >= nextHeartDropTime) {
                triggerHeartDrop();
                nextHeartDropTime += 60 + Math.random() * 30;
            }

            // Obstacle Course trigger (every 2-3 min)
            if (!isObstacleCourse && !motherShip && eventClock >= nextObstacleCourseTime) {
                startObstacleCourse();
            }

            // Chest reward countdown
            if (chestRewardTimer > 0) chestRewardTimer -= dt;

            // Next Event Countdown Display
            const timeToWall = nextWallEventTime - eventClock;
            const timeToCross = nextCrossfireEventTime - eventClock;
            const nextEventSecs = Math.max(1, Math.ceil(Math.min(timeToWall, timeToCross)));
            const nextEventType = timeToWall < timeToCross ? "WALL" : "CROSSFIRE";
            waveTimerDisplay.textContent = `${nextEventType}: ${nextEventSecs}s`;

            // Player Invulnerability & Power-up Timers
            if (player.invulnerableTimer > 0) player.invulnerableTimer -= dt;
            if (player.collisionFlashTimer > 0) player.collisionFlashTimer -= dt;

            Object.keys(player.powerups).forEach(p => {
                if (player.powerups[p] > 0) player.powerups[p] -= dt;
            });

            // Touch Drag 2D Movement
            if (isTouching) {
                const deltaX = currentTouchPos.x - touchStartPos.x;
                const deltaY = currentTouchPos.y - touchStartPos.y;
                const targetX = playerStartPos.x + deltaX;
                const targetY = playerStartPos.y + deltaY;
                const lerpSpeed = 20;
                player.x += (targetX - player.x) * Math.min(dt * lerpSpeed, 1);
                player.y += (targetY - player.y) * Math.min(dt * lerpSpeed, 1);
            }

            // Keyboard 2D Movement
            if (keys.Left) player.x -= player.speed * dt;
            if (keys.Right) player.x += player.speed * dt;
            if (keys.Up) player.y -= player.speed * dt;
            if (keys.Down) player.y += player.speed * dt;

            // Clamp Player within canvas bounds
            const topMargin = 60;
            const bottomMargin = 20;
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius + topMargin, Math.min(canvas.height - player.radius - bottomMargin, player.y));

            // Auto-Firing System (paused only once the gauntlet walls are
            // actually close by — not from the moment the gauntlet is
            // merely triggered/approaching from off-screen)
            const insideGauntlet = isObstacleCourse && asteroids.some(a =>
                a.indestructible && Math.hypot(a.x - player.x, a.y - player.y) < 260
            );
            player.shootTimer -= dt;
            const currentShootInterval = player.powerups.rapid > 0 ? player.shootInterval / 2.2 : player.shootInterval;
            if (!insideGauntlet && (isTouching || keys.Space || true) && player.shootTimer <= 0) {
                fireBullet();
                player.shootTimer = currentShootInterval;
            }

            // Alien Ships / Mothership — run on their own clock so they keep
            // threatening Earth even while a gauntlet is in progress.
            alienClock += dt;
            updateAlienShips(dt);
            if (!isPlaying) return;
            updateMotherShip(dt);
            if (!isPlaying) return;
            updateEnemyBullets(dt);
            if (!isPlaying) return;

            // Asteroid Spawning Logic (skip during gauntlet or while a mothership is present)
            if (!isObstacleCourse && !motherShip) {
                spawnTimer += dt * 1000;
                if (spawnTimer >= spawnInterval) {
                    spawnAsteroid();
                    spawnTimer = 0;
                    spawnInterval = Math.max(350, 1000 - Math.floor(score / 300) * 50);
                }
            }

            const asteroidSpeedMultiplier = player.powerups.slow > 0 ? 0.35 : 1.0;

            // Update Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                if (b.y < -10 || b.x < -10 || b.x > canvas.width + 10 || b.y > canvas.height + 10) {
                    bullets.splice(i, 1);
                }
            }

            // Update Missiles
            for (let i = missiles.length - 1; i >= 0; i--) {
                const m = missiles[i];

                // Home in on its target, if it's still alive. This steers the
                // missile's heading directly toward the target at a fast,
                // fixed turn rate — not a gentle velocity nudge — so it can
                // loop around or even fly backward to run it down, like a
                // real seeker missile.
                const targetAlive = m.target && (alienShips.includes(m.target) || m.target === motherShip);
                if (targetAlive) {
                    const desiredAngle = Math.atan2(m.target.y - m.y, m.target.x - m.x);
                    let diff = desiredAngle - m.angle;
                    diff = Math.atan2(Math.sin(diff), Math.cos(diff)); // normalize to [-PI, PI]
                    const maxTurn = 4.2 * dt; // ~240°/s — tight enough to reverse course quickly
                    if (Math.abs(diff) <= maxTurn) m.angle = desiredAngle;
                    else m.angle += Math.sign(diff) * maxTurn;
                }

                m.x += Math.cos(m.angle) * m.speed * dt;
                m.y += Math.sin(m.angle) * m.speed * dt;

                let hit = false;

                // vs mothership: regular missile = 5% of max HP, torpedo = 10%
                if (!hit && motherShip) {
                    const d = Math.hypot(motherShip.x - m.x, motherShip.y - m.y);
                    if (d < motherShip.radius + m.radius) {
                        const dmg = motherShip.maxHp * (m.isTorpedo ? 0.10 : 0.05);
                        createExplosion(m.x, m.y, m.isTorpedo ? '#a855f7' : '#f97316', 22);
                        createExplosion(m.x, m.y, '#ffffff', 14);
                        sfx.playExplosion(true);
                        damageMotherShip(dmg);
                        hit = true;
                    }
                }

                // vs regular alien ships: missile = 25% of max HP, torpedo = 50%
                if (!hit) {
                    for (let s = alienShips.length - 1; s >= 0; s--) {
                        const ship = alienShips[s];
                        const d = Math.hypot(ship.x - m.x, ship.y - m.y);
                        if (d < ship.radius + m.radius) {
                            const dmg = ship.maxHp * (m.isTorpedo ? 0.50 : 0.25);
                            createExplosion(m.x, m.y, m.isTorpedo ? '#a855f7' : '#f97316', 22);
                            createExplosion(m.x, m.y, '#ffffff', 14);
                            sfx.playExplosion(true);
                            damageAlienShip(ship, dmg, '#4ade80');
                            hit = true;
                            break;
                        }
                    }
                }

                if (!hit) {
                    for (let j = asteroids.length - 1; j >= 0; j--) {
                        const a = asteroids[j];
                        const d = Math.hypot(a.x - m.x, a.y - m.y);
                        if (d < a.radius + m.radius) {
                            createExplosion(m.x, m.y, '#f97316', 20);
                            sfx.playExplosion(a.radius > 30);
                            // Splash-clears nearby destructible asteroids (gauntlet rocks are immune)
                            const splashR = 70;
                            for (let k = asteroids.length - 1; k >= 0; k--) {
                                const a2 = asteroids[k];
                                if (a2.indestructible) continue;
                                if (Math.hypot(a2.x - m.x, a2.y - m.y) < splashR) {
                                    addScore(a2.points);
                                    createExplosion(a2.x, a2.y, '#94a3b8', Math.floor(a2.radius / 2));
                                    asteroids.splice(k, 1);
                                }
                            }
                            hit = true;
                            break;
                        }
                    }
                }

                if (hit || m.y < -30 || m.x < -30 || m.x > canvas.width + 30 || m.y > canvas.height + 30) {
                    missiles.splice(i, 1);
                }
            }

            // Update Asteroids & Collisions
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const a = asteroids[i];
                a.x += a.vx * dt * asteroidSpeedMultiplier;
                a.y += a.vy * dt * asteroidSpeedMultiplier;
                a.rotation += a.vRot * dt * asteroidSpeedMultiplier;

                // Collision with Ship
                const distToPlayer = Math.hypot(a.x - player.x, a.y - player.y);
                if (distToPlayer < a.radius + player.radius) {
                    if (player.powerups.shield > 0) {
                        player.powerups.shield = 0;
                        player.shieldCharge = 0;
                        player.invulnerableTimer = 1.0;
                        player.collisionFlashTimer = COLLISION_FLASH_DURATION;
                        createExplosion(a.x, a.y, a.indestructible ? '#f97316' : '#38bdf8', a.indestructible ? 12 : 15);
                        sfx.playHit();
                        if (!a.indestructible) asteroids.splice(i, 1);
                        continue;
                    } else if (player.invulnerableTimer <= 0) {
                        player.lives--;
                        updateLivesUI();
                        createExplosion(player.x, player.y, '#ef4444', 20);
                        sfx.playHit();
                        player.invulnerableTimer = 1.5;
                        player.collisionFlashTimer = COLLISION_FLASH_DURATION;

                        if (player.lives <= 0) {
                            gameOver();
                            return;
                        }
                    }
                }

                // Off-screen cleanup for asteroids traveling in crossfire directions
                if (a.x < -100 || a.x > canvas.width + 100 || a.y < -100 || a.y > canvas.height + 100) {
                    // Check if it moved far enough out to splice
                    if (a.y > canvas.height + a.radius || a.y < -a.radius - 80 || a.x < -a.radius - 80 || a.x > canvas.width + a.radius + 80) {
                        if (!a.indestructible) intervalPerfectClear = false; // escaped undestroyed — breaks the photon-torpedo streak
                        asteroids.splice(i, 1);
                        continue;
                    }
                }

                // Bullet Collision
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    const distToBullet = Math.hypot(a.x - b.x, a.y - b.y);

                    if (distToBullet < a.radius + b.radius) {
                        bullets.splice(j, 1);

                        if (a.indestructible) {
                            // Gauntlet wall rock — impervious. Bullet just sparks off.
                            createExplosion(b.x, b.y, '#fb923c', 4);
                            break;
                        }

                        a.hp--;
                        createExplosion(b.x, b.y, '#f59e0b', 5);

                        if (a.hp <= 0) {
                            addScore(a.points);
                            sfx.playExplosion(a.radius > 30);
                            createExplosion(a.x, a.y, '#94a3b8', Math.floor(a.radius / 2));

                            if (a.radius > 28) {
                                for (let k = 0; k < 2; k++) {
                                    asteroids.push({
                                        x: a.x + (Math.random() - 0.5) * 10,
                                        y: a.y + (Math.random() - 0.5) * 10,
                                        radius: a.radius / 1.8,
                                        vx: (Math.random() - 0.5) * 120,
                                        vy: Math.random() * 100 + 60,
                                        rotation: 0,
                                        vRot: (Math.random() - 0.5) * 3,
                                        hp: 1,
                                        maxHp: 1,
                                        points: 10,
                                        numVertices: 6,
                                        offsetAngles: Array(6).fill(0).map(() => 0.7 + Math.random() * 0.6)
                                    });
                                }
                            }

                            if (Math.random() < 0.14) {
                                spawnPowerup(a.x, a.y);
                            }

                            asteroids.splice(i, 1);
                        }
                        break;
                    }
                }
            }

            // Update Power-ups
            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.y += p.vy * dt;

                const distToPlayer = Math.hypot(p.x - player.x, p.y - player.y);
                if (distToPlayer < p.radius + player.radius) {
                    sfx.playPowerup();
                    if (p.type === 'shield') {
                        player.powerups.shield = 8;
                        player.shieldCharge = 1;
                    } else if (p.type === 'slow') {
                        player.powerups.slow = 60;
                    } else if (p.type === 'missile') {
                        missileStock++;
                        updateMissileUI();
                    } else {
                        player.powerups[p.type] = 7;
                    }
                    powerups.splice(i, 1);
                    continue;
                }

                if (p.y > canvas.height + 20) {
                    powerups.splice(i, 1);
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx * dt;
                pt.y += pt.vy * dt;
                pt.alpha -= pt.decay * dt;
                if (pt.alpha <= 0) particles.splice(i, 1);
            }

            // === Update Falling Hearts ===
            for (let i = fallingHearts.length - 1; i >= 0; i--) {
                const h = fallingHearts[i];
                h.y += h.vy * dt;
                h.wobble = (h.wobble || 0) + dt * 3;

                const dist = Math.hypot(h.x - player.x, h.y - player.y);
                if (dist < h.radius + player.radius) {
                    if (player.lives < player.maxLives) {
                        player.lives++;
                        updateLivesUI();
                    }
                    sfx.playHeartPickup();
                    createExplosion(h.x, h.y, '#f43f5e', 14);
                    fallingHearts.splice(i, 1);
                    continue;
                }
                if (h.y > canvas.height + 50) fallingHearts.splice(i, 1);
            }

            // === Update Obstacle Course ===
            if (isObstacleCourse) updateObstacleCourse(dt, asteroidSpeedMultiplier);

            updatePowerupBadgesUI();
        }

        function render() {
            ctx.save();

            // Apply Screen Shake
            if (screenShake > 0) {
                const dx = (Math.random() - 0.5) * 16;
                const dy = (Math.random() - 0.5) * 16;
                ctx.translate(dx, dy);
            }

            // Clear Background
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Animated Starfield Background
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            if (!isPlaying) {
                ctx.restore();
                return;
            }

            // 1. Render Cascading Chain Laser Lightning Tree
            if (chainLaserAnimTimer > 0 && activeChainBranches.length > 0) {
                const alpha = Math.min(1, chainLaserAnimTimer / 0.5);
                ctx.save();
                ctx.globalAlpha = alpha;

                activeChainBranches.forEach(b => {
                    ctx.save();
                    ctx.strokeStyle = '#ec4899';
                    ctx.lineWidth = 6;
                    ctx.shadowColor = '#f472b6';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.moveTo(b.x1, b.y1);
                    const midX = (b.x1 + b.x2) / 2 + (Math.random() - 0.5) * 16;
                    const midY = (b.y1 + b.y2) / 2 + (Math.random() - 0.5) * 16;
                    ctx.lineTo(midX, midY);
                    ctx.lineTo(b.x2, b.y2);
                    ctx.stroke();
                    ctx.restore();

                    ctx.save();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(b.x1, b.y1);
                    ctx.lineTo(midX, midY);
                    ctx.lineTo(b.x2, b.y2);
                    ctx.stroke();
                    ctx.restore();
                });

                ctx.restore();
            }

            // 2. Render FAN-5 — direct beams from the ship to each targeted point
            if (crossLaserAnimTimer > 0 && crossLaserBeamTargets.length > 0) {
                const alpha = Math.min(1, crossLaserAnimTimer / 0.45);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.shadowColor = '#22d3ee';
                ctx.shadowBlur = 25;
                ctx.lineCap = 'round';

                crossLaserBeamTargets.forEach(t => {
                    ctx.strokeStyle = '#06b6d4';
                    ctx.lineWidth = 10;
                    ctx.beginPath();
                    ctx.moveTo(player.x, player.y);
                    ctx.lineTo(t.x, t.y);
                    ctx.stroke();

                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(player.x, player.y);
                    ctx.lineTo(t.x, t.y);
                    ctx.stroke();
                });

                ctx.restore();
            }

            // Render Floating Power-ups
            powerups.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                const colorMap = { rapid: '#f43f5e', spread: '#38bdf8', shield: '#a855f7', slow: '#f59e0b', missile: '#f97316' };
                const color = colorMap[p.type] || '#ffffff';
                ctx.shadowColor = color;
                ctx.shadowBlur = 10;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const labelMap = { rapid: 'R', spread: 'S', shield: '🛡', slow: 'H', missile: '🚀' };
                ctx.fillText(labelMap[p.type] || '?', 0, 1);
                ctx.restore();
            });

            // Render Missiles
            missiles.forEach(m => {
                ctx.save();
                ctx.translate(m.x, m.y);
                const ang = m.angle + Math.PI / 2;
                ctx.rotate(ang);
                ctx.shadowColor = '#f97316';
                ctx.shadowBlur = 12;
                ctx.fillStyle = '#fb923c';
                ctx.beginPath();
                ctx.moveTo(0, -12);
                ctx.lineTo(5, 8);
                ctx.lineTo(-5, 8);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#fde68a';
                ctx.beginPath();
                ctx.moveTo(-3, 8);
                ctx.lineTo(3, 8);
                ctx.lineTo(0, 8 + 6 + Math.random() * 6);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            });

            // Render Bullets
            bullets.forEach(b => {
                ctx.save();
                ctx.shadowColor = b.color;
                ctx.shadowBlur = 8;
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Render Alien Ships / Mothership / their bullets
            renderAlienShips();
            renderMotherShip();
            renderEnemyBullets();

            // Render Gauntlet countdown HUD (the walls themselves are drawn
            // below, as ordinary asteroids — just colored differently)
            if (isObstacleCourse) renderGauntletHUD();

            // Render Chest Reward
            if (chestRewardTimer > 0) renderChestReward();

            // Render Procedural Jagged Asteroids
            asteroids.forEach(a => {
                ctx.save();
                ctx.translate(a.x, a.y);
                ctx.rotate(a.rotation);
                if (a.indestructible) {
                    ctx.strokeStyle = '#fb923c';
                    ctx.lineWidth = 2.5;
                    ctx.fillStyle = '#4c1d0a';
                    ctx.shadowColor = '#f97316';
                    ctx.shadowBlur = 10;
                } else {
                    ctx.strokeStyle = '#94a3b8';
                    ctx.lineWidth = 2;
                    ctx.fillStyle = '#1e293b';
                }

                ctx.beginPath();
                const angleStep = (Math.PI * 2) / a.numVertices;
                for (let i = 0; i < a.numVertices; i++) {
                    const angle = i * angleStep;
                    const r = a.radius * a.offsetAngles[i];
                    const vx = Math.cos(angle) * r;
                    const vy = Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(vx, vy);
                    else ctx.lineTo(vx, vy);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            });

            // Render Falling Hearts
            renderFallingHearts();

            // Render Particles
            particles.forEach(pt => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, pt.alpha);
                ctx.fillStyle = pt.color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Collision indicator: red glow ring that blinks 3 times
            if (player.collisionFlashTimer > 0) {
                const elapsed = COLLISION_FLASH_DURATION - player.collisionFlashTimer;
                const halfCycle = COLLISION_FLASH_DURATION / 6; // 3 blinks = 6 on/off halves
                const blinkOn = Math.floor(elapsed / halfCycle) % 2 === 0;
                if (blinkOn) {
                    ctx.save();
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 4;
                    ctx.shadowColor = '#ef4444';
                    ctx.shadowBlur = 26;
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, player.radius + 14, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // Render Player Spacecraft
            if (player.invulnerableTimer <= 0 || Math.floor(Date.now() / 100) % 2 === 0) {
                ctx.save();
                ctx.translate(player.x, player.y);

                if (player.powerups.shield > 0) {
                    ctx.save();
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 2.5;
                    ctx.shadowColor = '#38bdf8';
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.arc(0, -2, player.radius + 10, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // Flame Thruster
                ctx.fillStyle = Math.random() > 0.5 ? '#f97316' : '#ef4444';
                ctx.beginPath();
                ctx.moveTo(-6, player.radius - 4);
                ctx.lineTo(0, player.radius + 12 + Math.random() * 6);
                ctx.lineTo(6, player.radius - 4);
                ctx.closePath();
                ctx.fill();

                // Vector Ship Body
                ctx.fillStyle = '#0f172a';
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(0, -player.radius - 4);
                ctx.lineTo(player.radius, player.radius);
                ctx.lineTo(0, player.radius - 6);
                ctx.lineTo(-player.radius, player.radius);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Cockpit Glow
                ctx.fillStyle = '#06b6d4';
                ctx.beginPath();
                ctx.arc(0, -4, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            ctx.restore();
        }

        function updateLivesUI() {
            livesContainer.innerHTML = '';
            for (let i = 0; i < player.maxLives; i++) {
                const frac = Math.max(0, Math.min(1, player.lives - i));
                const wrap = document.createElement('span');
                wrap.style.position = 'relative';
                wrap.style.display = 'inline-block';
                wrap.style.width = '1em';
                wrap.style.height = '1em';

                const bg = document.createElement('i');
                bg.className = 'fa-solid fa-heart text-slate-700';
                bg.style.position = 'absolute';
                bg.style.inset = '0';
                wrap.appendChild(bg);

                if (frac > 0) {
                    const fgWrap = document.createElement('span');
                    fgWrap.style.position = 'absolute';
                    fgWrap.style.inset = '0';
                    fgWrap.style.width = (frac * 100) + '%';
                    fgWrap.style.overflow = 'hidden';
                    const fg = document.createElement('i');
                    fg.className = 'fa-solid fa-heart text-rose-500';
                    fgWrap.appendChild(fg);
                    wrap.appendChild(fgWrap);
                }

                livesContainer.appendChild(wrap);
            }
        }

        function updatePowerupBadgesUI() {
            powerupBadgeContainer.innerHTML = '';
            const activePowerups = [
                { key: 'rapid', name: 'Rapid', color: 'bg-rose-500/20 text-rose-400 border-rose-500/40' },
                { key: 'spread', name: 'Spread', color: 'bg-sky-500/20 text-sky-400 border-sky-500/40' },
                { key: 'shield', name: 'Shield', color: 'bg-indigo-500/20 text-indigo-400 border-indigo-500/40' },
                { key: 'slow', name: 'H (Slow)', color: 'bg-amber-500/20 text-amber-400 border-amber-500/40' }
            ];

            activePowerups.forEach(p => {
                if (player.powerups[p.key] > 0) {
                    const badge = document.createElement('div');
                    badge.className = `px-2 py-0.5 text-[10px] rounded-md border font-bold flex items-center gap-1 ${p.color}`;
                    badge.innerHTML = `<span>${p.name}</span> <span class="opacity-80">${Math.ceil(player.powerups[p.key])}s</span>`;
                    powerupBadgeContainer.appendChild(badge);
                }
            });
        }

        function resetGame() {
            score = 0;
            scoreDisplay.textContent = '0';
            highScoreDisplay.textContent = `High: ${highScore}`;
            player.lives = 3;
            player.maxLives = 3;
            player.shieldCharge = 0;
            player.invulnerableTimer = 0;
            player.collisionFlashTimer = 0;
            player.powerups = { rapid: 0, spread: 0, shield: 0, slow: 0 };
            player.x = canvas.width / 2;
            player.y = canvas.height - 100;

            chainLaserCharges = 0;
            fanLaserCharges = 0;
            lastLaserThreshold = 0;
            nextLaserGrantIsChain = true;
            hasPhotonTorpedoes = false;
            activeChainBranches = [];
            chainLaserAnimTimer = 0;
            crossLaserAnimTimer = 0;
            crossLaserBeamTargets = [];
            updateChainLaserUI();
            updateFanLaserUI();

            eventClock = 0;
            nextWallEventTime = 60;
            nextCrossfireEventTime = 30;
            waveWarning.classList.add('hidden');

            bullets = [];
            missiles = [];
            missileStock = 0;
            updateMissileUI();
            asteroids = [];
            particles = [];
            powerups = [];
            enemyBullets = [];
            fallingHearts = [];
            nextHeartDropTime = 60 + Math.random() * 30;
            isObstacleCourse = false;
            obstacleCourseTimer = 0;
            pathSection = null;
            gauntletRowTimer = 0;
            gauntletRowIndex = 0;
            nextObstacleCourseTime = 45;
            chestRewardTimer = 0;
            intervalPerfectClear = true;
            intervalAsteroidsSpawned = 0;

            alienShips = [];
            alienClock = 0;
            nextAlienShipTime = 40;
            alienWaveCount = 0;

            motherShip = null;
            motherShipsDestroyed = 0;
            nextMotherShipTime = 300;

            spawnTimer = 0;
            spawnInterval = 1000;

            isPaused = false;
            pauseScreen.classList.add('hidden');

            updateLivesUI();
        }

        function startGame() {
            sfx.init();
            resetGame();
            startScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            isPlaying = true;
        }

        function qualifiesForLeaderboard(s) {
            if (s <= 0) return false;
            if (leaderboard.length < 10) return true;
            return s > leaderboard[leaderboard.length - 1].score;
        }

        function saveLeaderboardEntry(name, s) {
            leaderboard.push({ name: name, score: s });
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 10);
            localStorage.setItem('asteroid_leaderboard', JSON.stringify(leaderboard));
        }

        function renderLeaderboardList() {
            leaderboardList.innerHTML = '';
            if (leaderboard.length === 0) {
                leaderboardList.innerHTML = '<li class="text-slate-500 text-center">No scores yet — be the first!</li>';
                return;
            }
            leaderboard.forEach((entry, i) => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center';
                li.innerHTML = `<span>${i + 1}. ${entry.name}</span><span class="text-cyan-300 font-bold">${entry.score}</span>`;
                leaderboardList.appendChild(li);
            });
        }

        function gameOver(reason) {
            isPlaying = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('asteroid_highscore', highScore.toString());
                startHighscore.textContent = `High Score: ${highScore}`;
            }

            if (reason === 'alien') {
                gameoverTitle.textContent = 'GAME OVER';
                gameoverSubtitle.textContent = 'Alien Ship Destroyed The Earth';
            } else {
                gameoverTitle.textContent = 'MISSION FAILED';
                gameoverSubtitle.textContent = 'Ship Hull Destroyed';
            }

            finalScore.textContent = score;
            finalHighScore.textContent = highScore;
            gameoverScreen.classList.remove('hidden');

            if (qualifiesForLeaderboard(score)) {
                nameEntryScore.textContent = score;
                nameEntryInput.value = '';
                nameEntryScreen.classList.remove('hidden');
            }
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            update(dt);
            render();

            requestAnimationFrame(gameLoop);
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        viewLeaderboardBtn.addEventListener('click', () => {
            renderLeaderboardList();
            leaderboardScreen.classList.remove('hidden');
        });
        leaderboardCloseBtn.addEventListener('click', () => {
            leaderboardScreen.classList.add('hidden');
        });
        nameEntryBtn.addEventListener('click', () => {
            const name = (nameEntryInput.value || '').trim().slice(0, 12) || 'ANON';
            saveLeaderboardEntry(name, score);
            nameEntryScreen.classList.add('hidden');
        });

        // Register Service Worker for PWA / offline play
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.warn('SW registration failed:', err));
            });
        }

        window.onload = () => {
            resizeCanvas();
            highScoreDisplay.textContent = `High: ${highScore}`;
            startHighscore.textContent = `High Score: ${highScore}`;
            updateLivesUI();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>

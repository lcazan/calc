<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#06b6d4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Asteroid Dash">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Asteroid Shooter Arcade - Ultimate Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.8), 0 0 20px rgba(147, 51, 234, 0.6);
        }
        .glow-btn {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }
        .glow-btn:active {
            transform: scale(0.95);
        }

        /* Pulse Animations for Weapon Buttons */
        @keyframes laserGlowPink {
            0%, 100% { box-shadow: 0 0 12px rgba(236, 72, 153, 0.8), inset 0 0 8px rgba(236, 72, 153, 0.5); }
            50% { box-shadow: 0 0 24px rgba(244, 114, 182, 1), inset 0 0 14px rgba(244, 114, 182, 0.8); }
        }
        @keyframes laserGlowCyan {
            0%, 100% { box-shadow: 0 0 12px rgba(6, 182, 212, 0.8), inset 0 0 8px rgba(6, 182, 212, 0.5); }
            50% { box-shadow: 0 0 24px rgba(34, 211, 238, 1), inset 0 0 14px rgba(34, 211, 238, 0.8); }
        }
        .laser-btn-chain {
            animation: laserGlowPink 1.2s infinite ease-in-out;
        }
        .laser-btn-cross {
            animation: laserGlowCyan 1.2s infinite ease-in-out;
        }

        /* Warning Banner Pulse */
        @keyframes warningPulse {
            0%, 100% { opacity: 0.2; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
        .warning-banner {
            animation: warningPulse 0.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="relative flex flex-col items-center justify-center min-h-screen bg-slate-950 text-white overflow-hidden">

    <!-- HUD Layer -->
    <div id="hud" class="absolute top-0 left-0 w-full p-3 md:p-4 pointer-events-none z-10 flex justify-between items-start">
        
        <!-- Top-Left: Shared Super Laser Weapon Triggers -->
        <div class="flex items-center gap-2 md:gap-3 pointer-events-auto">
            <!-- Cascading Chain Laser Button -->
            <button id="chain-laser-btn" class="hidden relative group flex items-center justify-center w-12 h-12 md:w-16 md:h-16 rounded-2xl bg-gradient-to-tr from-fuchsia-600 to-pink-500 border-2 border-pink-300 text-white shadow-xl transition-all duration-200 active:scale-95 laser-btn-chain">
                <i class="fa-solid fa-sitemap text-xl md:text-3xl rotate-180 animate-pulse"></i>
                <span id="chain-badge" class="absolute -top-2 -right-2 w-5 h-5 md:w-7 md:h-7 rounded-full bg-cyan-400 text-slate-950 font-black text-[10px] md:text-sm flex items-center justify-center border-2 border-slate-950 shadow-md">0</span>
                <span class="absolute -bottom-4 text-[9px] md:text-[10px] font-bold text-pink-300 tracking-wider uppercase whitespace-nowrap">CHAIN [L]</span>
            </button>

            <!-- 4-Way Cross Laser Button -->
            <button id="cross-laser-btn" class="hidden relative group flex items-center justify-center w-12 h-12 md:w-16 md:h-16 rounded-2xl bg-gradient-to-tr from-cyan-600 to-teal-400 border-2 border-cyan-200 text-white shadow-xl transition-all duration-200 active:scale-95 laser-btn-cross">
                <i class="fa-solid fa-arrows-to-dot text-xl md:text-3xl animate-pulse"></i>
                <span id="fan-badge" class="absolute -top-2 -right-2 w-5 h-5 md:w-7 md:h-7 rounded-full bg-pink-400 text-slate-950 font-black text-[10px] md:text-sm flex items-center justify-center border-2 border-slate-950 shadow-md">0</span>
                <span class="absolute -bottom-4 text-[9px] md:text-[10px] font-bold text-cyan-300 tracking-wider uppercase whitespace-nowrap">FAN-5 [K]</span>
            </button>

            <!-- Homing Missile Button -->
            <button id="missile-btn" class="hidden relative group flex items-center justify-center w-12 h-12 md:w-16 md:h-16 rounded-2xl bg-gradient-to-tr from-orange-600 to-amber-400 border-2 border-orange-200 text-white shadow-xl transition-all duration-200 active:scale-95">
                <i class="fa-solid fa-rocket text-xl md:text-3xl animate-pulse"></i>
                <span id="missile-badge" class="absolute -top-2 -right-2 w-5 h-5 md:w-7 md:h-7 rounded-full bg-orange-300 text-slate-950 font-black text-[10px] md:text-sm flex items-center justify-center border-2 border-slate-950 shadow-md">0</span>
                <span class="absolute -bottom-4 text-[9px] md:text-[10px] font-bold text-orange-300 tracking-wider uppercase whitespace-nowrap">MISSILE [M]</span>
            </button>

            <!-- Score Display -->
            <div class="flex flex-col ml-1 pointer-events-none">
                <span class="text-[10px] md:text-xs tracking-widest text-indigo-400 uppercase font-semibold">Score</span>
                <span id="score-display" class="text-xl md:text-3xl font-black text-cyan-300 tracking-wider">0</span>
                <span id="high-score-display" class="text-[10px] md:text-xs text-slate-400">High: 0</span>
            </div>
        </div>

        <!-- Center: Wave Event Countdown & Active Badges -->
        <div class="flex flex-col items-center gap-1 pointer-events-none">
            <div id="wave-timer-display" class="text-[10px] md:text-xs font-bold text-amber-400 bg-amber-950/70 border border-amber-500/40 px-2.5 py-1 rounded-full shadow-md">
                EVENT: 30s
            </div>
            <div id="powerup-badge-container" class="flex flex-wrap gap-1 max-w-[180px] justify-center"></div>
        </div>

        <!-- Top-Right: Pause Button & Health/Shield Display -->
        <div class="flex flex-col items-end gap-2 pointer-events-auto">
            <button id="pause-btn" class="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-200 text-xs md:text-sm font-bold shadow-lg hover:bg-slate-700 active:scale-95 transition-all">
                <i class="fa-solid fa-pause text-cyan-400"></i>
                <span class="hidden md:inline">PAUSE</span>
            </button>
            <div class="flex flex-col items-end pointer-events-none">
                <span class="text-[10px] md:text-xs tracking-widest text-indigo-400 uppercase font-semibold">Hull</span>
                <div id="lives-container" class="flex gap-1 mt-0.5 text-base md:text-lg text-rose-500">
                    <i class="fa-solid fa-heart"></i>
                    <i class="fa-solid fa-heart"></i>
                    <i class="fa-solid fa-heart"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Event Warning Banners -->
    <div id="wave-warning" class="hidden absolute top-20 inset-x-0 z-10 flex items-center justify-center pointer-events-none px-4">
        <div id="warning-box" class="warning-banner bg-rose-600/90 text-white border-2 border-amber-300 px-4 md:px-6 py-2 rounded-2xl shadow-2xl flex items-center gap-2 md:gap-3 text-center">
            <i class="fa-solid fa-triangle-exclamation text-amber-300 text-lg md:text-xl"></i>
            <span id="warning-text" class="font-black text-xs md:text-base tracking-widest uppercase">WARNING!</span>
            <i class="fa-solid fa-triangle-exclamation text-amber-300 text-lg md:text-xl"></i>
        </div>
    </div>

    <!-- Start Screen Modal -->
    <div id="start-screen" class="absolute inset-0 z-20 flex flex-col items-center justify-center p-6 bg-slate-950/85 backdrop-blur-md">
        <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 p-6 md:p-8 rounded-2xl shadow-2xl text-center flex flex-col items-center">
            <div class="w-16 h-16 mb-4 rounded-full bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-cyan-500/30">
                <i class="fa-solid fa-rocket text-2xl text-white"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-black tracking-tight text-white glow-text mb-2">ASTEROID DASH</h1>
            <p id="start-highscore" class="text-slate-400 text-sm md:text-base mb-6">High Score: 0</p>

            <button id="start-btn" class="w-full py-3.5 px-6 rounded-xl font-bold text-lg bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white glow-btn transition-all duration-200">
                PLAY NOW
            </button>
            <button id="view-leaderboard-btn" class="mt-3 text-xs text-slate-400 hover:text-cyan-300 underline underline-offset-2">View Top 10</button>
        </div>
    </div>

    <!-- New High Score Name Entry Modal -->
    <div id="name-entry-screen" class="hidden absolute inset-0 z-30 flex flex-col items-center justify-center p-6 bg-slate-950/90 backdrop-blur-md">
        <div class="max-w-xs w-full bg-slate-900 border border-amber-500/40 p-6 rounded-2xl shadow-2xl text-center flex flex-col items-center">
            <i class="fa-solid fa-trophy text-4xl text-amber-400 mb-3"></i>
            <h2 class="text-xl font-black text-white tracking-wider mb-1">NEW HIGH SCORE!</h2>
            <p id="name-entry-score" class="text-cyan-300 text-2xl font-black mb-4">0</p>
            <input id="name-entry-input" maxlength="12" placeholder="Your name" class="w-full mb-4 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white text-center focus:outline-none focus:border-cyan-400" />
            <button id="name-entry-btn" class="w-full py-3 px-6 rounded-xl font-bold bg-gradient-to-r from-amber-500 to-orange-500 text-white glow-btn transition-all duration-200">SAVE</button>
        </div>
    </div>

    <!-- Leaderboard (Top 10) Modal -->
    <div id="leaderboard-screen" class="hidden absolute inset-0 z-30 flex flex-col items-center justify-center p-6 bg-slate-950/90 backdrop-blur-md">
        <div class="max-w-xs w-full bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl text-center flex flex-col items-center">
            <h2 class="text-xl font-black text-white tracking-wider mb-4">TOP 10</h2>
            <ol id="leaderboard-list" class="w-full text-left text-sm text-slate-300 space-y-1.5 mb-5"></ol>
            <button id="leaderboard-close-btn" class="w-full py-3 px-6 rounded-xl font-bold bg-gradient-to-r from-cyan-500 to-indigo-600 text-white glow-btn transition-all duration-200">CLOSE</button>
        </div>
    </div>

    <!-- Pause Screen Modal -->
    <div id="pause-screen" class="hidden absolute inset-0 z-20 flex flex-col items-center justify-center p-6 bg-slate-950/80 backdrop-blur-md">
        <div class="max-w-xs w-full bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl text-center flex flex-col items-center">
            <i class="fa-solid fa-circle-pause text-5xl text-cyan-400 mb-3 animate-pulse"></i>
            <h2 class="text-2xl font-black text-white tracking-wider mb-1">GAME PAUSED</h2>
            <p class="text-slate-400 text-xs mb-6">Take a breather, Commander!</p>
            <button id="resume-btn" class="w-full py-3 px-6 rounded-xl font-bold text-base bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white glow-btn transition-all duration-200">
                RESUME
            </button>
        </div>
    </div>

    <!-- Game Over Screen Modal -->
    <div id="gameover-screen" class="hidden absolute inset-0 z-20 flex flex-col items-center justify-center p-6 bg-slate-950/90 backdrop-blur-md">
        <div class="max-w-md w-full bg-slate-900/90 border border-rose-950/50 p-6 md:p-8 rounded-2xl shadow-2xl text-center flex flex-col items-center">
            <div class="w-16 h-16 mb-4 rounded-full bg-rose-500/20 border border-rose-500/50 flex items-center justify-center text-rose-500">
                <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
            </div>
            <h2 id="gameover-title" class="text-3xl font-black text-rose-500 tracking-wider mb-1">MISSION FAILED</h2>
            <p id="gameover-subtitle" class="text-slate-400 text-xs mb-6 uppercase tracking-widest">Ship Hull Destroyed</p>

            <div class="w-full bg-slate-800/80 rounded-xl p-4 mb-6 space-y-3">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400">Final Score:</span>
                    <span id="final-score" class="text-2xl font-black text-cyan-400">0</span>
                </div>
                <div class="flex justify-between items-center text-sm pt-2 border-t border-slate-700/60">
                    <span class="text-slate-400">Best Score:</span>
                    <span id="final-high-score" class="text-lg font-bold text-slate-200">0</span>
                </div>
            </div>

            <button id="restart-btn" class="w-full py-3.5 px-6 rounded-xl font-bold text-lg bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white shadow-lg shadow-emerald-500/20 glow-btn transition-all duration-200">
                PLAY AGAIN
            </button>
        </div>
    </div>

    <!-- Main Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <script>
        // Web Audio API Synthesizer
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playShoot() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playCascadingLaser() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc1 = this.ctx.createOscillator();
                const gain1 = this.ctx.createGain();
                osc1.type = 'sawtooth';
                osc1.frequency.setValueAtTime(1500, now);
                osc1.frequency.exponentialRampToValueAtTime(80, now + 0.8);
                gain1.gain.setValueAtTime(0.35, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
                osc1.connect(gain1);
                gain1.connect(this.ctx.destination);
                osc1.start(now);
                osc1.stop(now + 0.8);
            }

            playCrossLaser() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(1200, now + 0.2);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.7);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.7);
            }

            playExplosion(isLarge = false) {
                if (!this.ctx) return;
                const dur = isLarge ? 0.35 : 0.18;
                const bufferSize = this.ctx.sampleRate * dur;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                const whiteNoise = this.ctx.createBufferSource();
                whiteNoise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(isLarge ? 400 : 800, this.ctx.currentTime);
                filter.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + dur);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(isLarge ? 0.3 : 0.18, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
                whiteNoise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                whiteNoise.start();
            }

            playPowerup() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                const now = this.ctx.currentTime;
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(500, now + 0.08);
                osc.frequency.setValueAtTime(800, now + 0.16);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }

            playHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playHeartPickup() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                const now = this.ctx.currentTime;
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.setValueAtTime(800, now + 0.1);
                osc.frequency.setValueAtTime(1100, now + 0.22);
                gain.gain.setValueAtTime(0.28, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.48);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.48);
            }

            playGauntletSuccess() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                [440, 554, 659, 880].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + i * 0.13);
                    g.gain.setValueAtTime(0.22, now + i * 0.13);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.13 + 0.35);
                    osc.connect(g); g.connect(this.ctx.destination);
                    osc.start(now + i * 0.13);
                    osc.stop(now + i * 0.13 + 0.35);
                });
            }
        }

        const sfx = new SoundFX();

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Element References
        const scoreDisplay = document.getElementById('score-display');
        const highScoreDisplay = document.getElementById('high-score-display');
        const livesContainer = document.getElementById('lives-container');
        const powerupBadgeContainer = document.getElementById('powerup-badge-container');
        const waveTimerDisplay = document.getElementById('wave-timer-display');
        const waveWarning = document.getElementById('wave-warning');
        const warningText = document.getElementById('warning-text');
        const chainLaserBtn = document.getElementById('chain-laser-btn');
        const crossLaserBtn = document.getElementById('cross-laser-btn');
        const missileBtn = document.getElementById('missile-btn');
        const missileBadge = document.getElementById('missile-badge');
        const chainBadge = document.getElementById('chain-badge');
        const fanBadge = document.getElementById('fan-badge');
        const pauseBtn = document.getElementById('pause-btn');
        const pauseScreen = document.getElementById('pause-screen');
        const resumeBtn = document.getElementById('resume-btn');
        const startScreen = document.getElementById('start-screen');
        const startHighscore = document.getElementById('start-highscore');
        const viewLeaderboardBtn = document.getElementById('view-leaderboard-btn');
        const nameEntryScreen = document.getElementById('name-entry-screen');
        const nameEntryScore = document.getElementById('name-entry-score');
        const nameEntryInput = document.getElementById('name-entry-input');
        const nameEntryBtn = document.getElementById('name-entry-btn');
        const leaderboardScreen = document.getElementById('leaderboard-screen');
        const leaderboardList = document.getElementById('leaderboard-list');
        const leaderboardCloseBtn = document.getElementById('leaderboard-close-btn');
        const gameoverScreen = document.getElementById('gameover-screen');
        const gameoverTitle = document.getElementById('gameover-title');
        const gameoverSubtitle = document.getElementById('gameover-subtitle');
        const finalScore = document.getElementById('final-score');
        const finalHighScore = document.getElementById('final-high-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // Game Logic Variables
        let isPlaying = false;
        let isPaused = false;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('asteroid_highscore') || '0');
        let lastTime = 0;
        let spawnTimer = 0;
        let spawnInterval = 1000;

        // Wave Event Timeline Manager
        let eventClock = 0; // Cumulative active seconds
        let nextWallEventTime = 60; // 60s, 120s, 180s...
        let nextCrossfireEventTime = 30; // 30s, 90s, 150s...

        // Independent Laser Charge Pools (earned alternately, spent independently)
        let chainLaserCharges = 0;
        let fanLaserCharges = 0;
        let lastLaserThreshold = 0; // Earn 1 charge per 300 points
        let nextLaserGrantIsChain = true; // alternates which pool gets the next earned charge
        let missiles = [];
        let missileStock = 0;
        let hasPhotonTorpedoes = false; // permanent upgrade once earned

        // Laser Animation Visual Timers
        let activeChainBranches = [];
        let chainLaserAnimTimer = 0;
        let crossLaserAnimTimer = 0;
        let crossLaserBeamTargets = [];
        let screenShake = 0;

        // Touch Control Variables (Relative 2D Drag)
        let isTouching = false;
        let touchStartPos = { x: 0, y: 0 };
        let playerStartPos = { x: 0, y: 0 };
        let currentTouchPos = { x: 0, y: 0 };

        // Player Spacecraft
        const player = {
            x: 0,
            y: 0,
            radius: 20,
            speed: 480,
            lives: 3,
            maxLives: 3,
            shieldCharge: 0, // 0-1, lets shield absorb two half-damage hits before breaking
            invulnerableTimer: 0,
            collisionFlashTimer: 0,
            shootTimer: 0,
            shootInterval: 0.18,
            powerups: {
                rapid: 0,
                spread: 0,
                shield: 0,
                slow: 0 // 30s Time Slow ('H')
            }
        };

        // Collections
        let bullets = [];
        let asteroids = [];
        let particles = [];
        let powerups = [];
        let stars = [];
        let enemyBullets = []; // fired at the player by alien ships / mothership

        // === Falling Heart Drops (every ~3 minutes) ===
        let fallingHearts = [];

        // WEAPON 1: Cascading Chain Laser (Consumes 1 Shared Charge Pool Stock)
        function triggerChainLaser() {
            if (!isPlaying || isPaused || chainLaserCharges <= 0) return;

            chainLaserCharges--;
            updateChainLaserUI();
            sfx.playCascadingLaser();
            screenShake = 0.5;

            activeChainBranches = [];
            const destroyedAsteroidIds = new Set();

            let firstTarget = null;
            let minDistToUpLine = Infinity;

            asteroids.forEach((a, index) => {
                if (a.indestructible) return;
                if (a.y <= player.y) {
                    const dx = Math.abs(a.x - player.x);
                    const dy = player.y - a.y;
                    const totalDist = dx * 2 + dy;
                    if (totalDist < minDistToUpLine) {
                        minDistToUpLine = totalDist;
                        firstTarget = { asteroid: a, index: index };
                    }
                }
            });

            if (!firstTarget) {
                activeChainBranches.push({ x1: player.x, y1: player.y, x2: player.x, y2: 0 });
            } else {
                const trunk = firstTarget.asteroid;
                activeChainBranches.push({ x1: player.x, y1: player.y, x2: trunk.x, y2: trunk.y });
                destroyedAsteroidIds.add(trunk);
                addScore(trunk.points);
                createExplosion(trunk.x, trunk.y, '#f472b6', 18);

                function cascadeBranch(currentAsteroid, depth) {
                    if (depth >= 6) return;
                    const candidates = asteroids.filter(a => !destroyedAsteroidIds.has(a) && !a.indestructible);
                    if (candidates.length === 0) return;

                    candidates.sort((a, b) => {
                        const distA = Math.hypot(a.x - currentAsteroid.x, a.y - currentAsteroid.y);
                        const distB = Math.hypot(b.x - currentAsteroid.x, b.y - currentAsteroid.y);
                        return distA - distB;
                    });

                    const targets = candidates.slice(0, 2);
                    targets.forEach(target => {
                        destroyedAsteroidIds.add(target);
                        addScore(target.points);
                        createExplosion(target.x, target.y, '#ec4899', 14);

                        activeChainBranches.push({
                            x1: currentAsteroid.x, y1: currentAsteroid.y,
                            x2: target.x, y2: target.y
                        });

                        cascadeBranch(target, depth + 1);
                    });
                }

                cascadeBranch(trunk, 1);
                asteroids = asteroids.filter(a => !destroyedAsteroidIds.has(a));
            }

            chainLaserAnimTimer = 0.5;
        }

        // WEAPON 2: FAN-5 — zaps the 5 nearest destructible targets directly
        function triggerCrossLaser() {
            if (!isPlaying || isPaused || fanLaserCharges <= 0) return;

            fanLaserCharges--;
            updateFanLaserUI();
            sfx.playCrossLaser();
            screenShake = 0.6;

            // Gather every destructible target: regular asteroids (not
            // gauntlet/indestructible rocks), alien ships, and the mothership.
            const candidates = [];
            asteroids.forEach(a => { if (!a.indestructible) candidates.push({ type: 'asteroid', ref: a }); });
            alienShips.forEach(s => candidates.push({ type: 'alien', ref: s }));
            if (motherShip) candidates.push({ type: 'mother', ref: motherShip });

            candidates.sort((a, b) => {
                const da = Math.hypot(a.ref.x - player.x, a.ref.y - player.y);
                const db = Math.hypot(b.ref.x - player.x, b.ref.y - player.y);
                return da - db;
            });

            const targets = candidates.slice(0, 5);
            // Store target points so render() can draw a beam from the ship to each
            crossLaserBeamTargets = targets.map(t => ({ x: t.ref.x, y: t.ref.y }));

            targets.forEach(t => {
                if (t.type === 'asteroid') {
                    const a = t.ref;
                    addScore(a.points);
                    createExplosion(a.x, a.y, '#22d3ee', 16);
                    const idx = asteroids.indexOf(a);
                    if (idx >= 0) asteroids.splice(idx, 1);
                } else if (t.type === 'alien') {
                    damageAlienShip(t.ref, 10, '#4ade80');
                } else if (t.type === 'mother') {
                    damageMotherShip(15);
                }
            });

            crossLaserAnimTimer = 0.45;
        }

        // === EVENT 3: Falling Heart Drops (~every 1-1.5 min) ===
        function triggerHeartDrop() {

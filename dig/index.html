<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#23170f">
<meta name="description" content="Dig underground, follow ore veins, sell your haul and upgrade your tools.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deep Dig">
<title>Neya's Mine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --wood:#3b2a1d; --wood-dk:#23170f; --wood-ln:#6b4a2f;
  --ink:#fff4e0; --muted:#d2b894; --lamp:#ffc21a; --lamp-ink:#3a2400;
  --pill:rgba(24,14,7,.74); --bg:#120b07;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --pill:rgba(18,10,5,.8); } }
:root[data-theme="dark"]{ --pill:rgba(18,10,5,.8); }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.disp{font-family:'Lilita One','Arial Black',Impact,sans-serif;font-weight:400;letter-spacing:.3px}

#app{position:fixed;inset:0;display:flex;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:var(--wood-dk)}
#stage{position:relative;flex:1;min-width:0;overflow:hidden;background:var(--bg)}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}

#hud{position:absolute;top:6px;left:6px;right:6px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.hudleft{display:flex;gap:6px;align-items:center}
#menubtn{pointer-events:auto;border:none;background:var(--pill);color:var(--ink);width:34px;height:34px;border-radius:10px;font-size:16px;flex:none}
.pillrow{display:flex;gap:4px;background:var(--pill);border-radius:12px;padding:4px 8px;align-items:center;flex-wrap:wrap}
.ri{display:flex;align-items:center;gap:4px;min-width:38px}
.ri b,.coins b{font-family:'Lilita One','Arial Black',sans-serif;font-weight:400;font-size:15px;line-height:1}
.ri.zero b{opacity:.45}
.ic{display:inline-block;width:16px;height:16px;flex:none;background:radial-gradient(circle at 35% 30%,var(--h) 0 20%,var(--c) 58%);clip-path:polygon(30% 0,76% 6%,100% 46%,82% 96%,24% 100%,0 55%)}
.ic.gem{clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%)}
.coin{display:inline-block;width:17px;height:17px;border-radius:50%;flex:none;background:radial-gradient(circle at 38% 34%,#fff6b8 0 14%,#ffcf2e 30%,#d68f00 78%);box-shadow:inset 0 0 0 2px #b77400}
.coin.sm{width:13px;height:13px}
.coins{display:flex;align-items:center;gap:5px}
.pop{animation:pop .35s ease-out}
@keyframes pop{40%{transform:scale(1.35)}}

#info{position:absolute;left:6px;bottom:6px;background:var(--pill);border-radius:10px;padding:4px 9px;font-size:12px;color:var(--muted);pointer-events:none}
#info b{color:var(--ink)}
#toast{position:absolute;left:50%;top:48px;transform:translateX(-50%);background:rgba(24,14,7,.9);border:2px solid var(--lamp);color:var(--ink);padding:6px 14px;border-radius:12px;font-weight:800;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:90%;text-align:center;white-space:normal}
#toast.show{opacity:1}

#panel{width:clamp(150px,23vw,210px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,2.4vh,14px);padding:8px;background:linear-gradient(90deg,#2c1f15,var(--wood) 30%,#33241a);border-left:3px solid var(--wood-ln);overflow-y:auto}

@media (orientation:portrait){
  #app{flex-direction:column}
  #panel{width:100%;max-width:none;flex-direction:row;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:6px;padding:6px;max-height:38vh;border-left:none;border-top:3px solid var(--wood-ln)}
  #panel #pad{--k:min(46px,8vh);order:1}
  #panel #upg{order:0;flex:1 1 100%}
  #panel #supportbtn,#panel #buildbtn{width:auto;max-width:none;flex:1 1 auto;font-size:12.5px;padding:6px 8px}
  #panel #matpick{width:auto;max-width:none;flex:1 1 100%}
}
#upg{width:100%;max-width:168px;border:none;border-radius:14px;padding:9px 6px;background:linear-gradient(#ffd54a,#f0a800);color:var(--lamp-ink);box-shadow:0 4px 0 #9a6400,inset 0 2px 0 rgba(255,255,255,.5);font-size:18px;display:flex;align-items:center;justify-content:center;gap:6px}
#upg:active{transform:translateY(3px);box-shadow:0 1px 0 #9a6400}
#supportbtn,#buildbtn{width:100%;max-width:168px;border:none;border-radius:12px;padding:7px 6px;color:#eaf4ff;box-shadow:0 3px 0 #1a3f6b,inset 0 2px 0 rgba(255,255,255,.35);font-size:14px;display:flex;align-items:center;justify-content:center;gap:5px}
#supportbtn{background:linear-gradient(#8a6a52,#5e4533);color:var(--ink);box-shadow:0 3px 0 #2e2016}
#buildbtn{background:linear-gradient(#5cb85c,#3d8b40);box-shadow:0 3px 0 #205e22,inset 0 2px 0 rgba(255,255,255,.35)}
#buildbtn.on{background:linear-gradient(#e0a838,#b8790f);box-shadow:0 3px 0 #7a4c00,inset 0 2px 0 rgba(255,255,255,.35)}
#supportbtn:active,#buildbtn:active{transform:translateY(2px)}
#matpick{display:flex;gap:6px;width:100%;max-width:168px}
#matpick .buy{flex:1;justify-content:center}
#pad{--k:min(50px,14vh);display:grid;grid-template-columns:repeat(3,var(--k));grid-template-rows:repeat(3,var(--k));gap:5px}
.db{border:none;border-radius:14px;background:linear-gradient(#8a6a52,#5e4533);box-shadow:0 4px 0 #2e2016,inset 0 2px 0 rgba(255,255,255,.2);display:grid;place-items:center;touch-action:none}
.db svg{width:55%;height:55%;fill:var(--ink)}
.db.on,.db:active{transform:translateY(3px);box-shadow:0 1px 0 #2e2016;background:linear-gradient(#a07a5c,#6f513b)}
.db[data-dir="1"] svg{transform:rotate(90deg)} .db[data-dir="2"] svg{transform:rotate(180deg)} .db[data-dir="3"] svg{transform:rotate(-90deg)}
#pad.buildmode .db{background:linear-gradient(#7fae5a,#4f7d38);box-shadow:0 4px 0 #2e4a20,inset 0 2px 0 rgba(255,255,255,.2)}
#pad.buildmode .db.on,#pad.buildmode .db:active{background:linear-gradient(#96c473,#628f49)}
#ring{border-radius:50%;margin:4px;display:grid;place-items:center;background:rgba(0,0,0,.25);position:relative}
#ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--wood)}
#ring span{position:relative;z-index:1;font-family:'Lilita One','Arial Black',sans-serif;font-size:13px}
#fillbtn{position:absolute;inset:7px;z-index:2;border:none;border-radius:50%;display:none;align-items:center;justify-content:center;background:linear-gradient(#ffd54a,#f0a800);color:var(--lamp-ink);font-size:1.15em;line-height:1;padding:0;box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
#fillbtn.show{display:flex}
#fillbtn:active{transform:translateY(2px)}

#modal,#menu,#splash{position:fixed;inset:0;background:rgba(10,5,2,.66);display:flex;align-items:center;justify-content:center;padding:max(8px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
#splash{z-index:8}
#modal[hidden],#menu[hidden],#splash[hidden]{display:none}
.buy.sel{outline:3px solid #fff4e0;outline-offset:-3px}
.sheet{width:min(780px,100%);max-height:100%;overflow:auto;background:linear-gradient(#3a2819,#2a1c12);border:3px solid var(--wood-ln);border-radius:18px;padding:10px 14px 12px;touch-action:pan-y}
.sheet header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.sheet h2{margin:0;font-size:24px;flex:1}
.sheet h3{margin:0 0 6px;font-size:16px;color:var(--muted);font-family:'Nunito',sans-serif;font-weight:900}
.sheet h3 small{font-weight:700;opacity:.8}
.bigcoins{background:rgba(0,0,0,.3);border-radius:12px;padding:5px 12px}
.bigcoins b{font-size:20px}
#close,#menuclose{border:none;background:rgba(255,255,255,.1);width:36px;height:36px;border-radius:50%;font-size:18px}
.cols{display:grid;grid-template-columns:1.15fr 1fr;gap:14px}
#sell{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{border:2px solid #5a3e28;background:#4a3322;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.tile .ic{width:26px;height:26px;margin-bottom:2px}
.tile .nm{font-weight:900;font-size:13px}
.tile .ct{font-family:'Lilita One','Arial Black',sans-serif;font-size:16px}
.tile .pr{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px}
.tile:disabled{opacity:.38;cursor:default}
.tile:not(:disabled):active{background:#5b3f29}
#sellall{margin-top:8px;width:100%;border:none;border-radius:12px;padding:9px;background:linear-gradient(#ffd54a,#f0a800);color:var(--lamp-ink);font-weight:900;box-shadow:0 3px 0 #9a6400}
#sellall:disabled{filter:grayscale(1);opacity:.5}
#tools{display:flex;flex-direction:column;gap:6px}
.tool{display:flex;align-items:center;gap:8px;background:#4a3322;border:2px solid #5a3e28;border-radius:12px;padding:5px 8px}
.tool.cur{border-color:var(--lamp)}
.tool canvas{width:72px;height:40px;flex:none}
.tt{flex:1;display:flex;flex-direction:column;line-height:1.15}
.tt b{font-size:14px}
.tt span{font-size:11.5px;color:var(--muted)}
.buy{border:none;border-radius:10px;padding:7px 10px;background:#6fbf4a;color:#10240a;font-weight:900;display:flex;align-items:center;gap:4px;box-shadow:0 3px 0 #3d7a24;white-space:nowrap}
.buy.sm{padding:4px 7px;font-size:11px;background:#5aa8d6;box-shadow:0 2px 0 #2a6d94}
.buy:disabled{background:#6b5a4b;color:#bda88f;box-shadow:0 3px 0 #3a2c20;cursor:default}
.tag{font-size:12px;font-weight:900;color:var(--lamp);padding:0 4px}
.toolbtns{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.sheet footer{margin-top:10px;display:flex;justify-content:flex-end}
#newmine.arm{border-color:#e0563f;color:#ffb3a5}
#floods:empty,#detect:empty{display:none}

@media (prefers-reduced-motion:reduce){.pop{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="hudleft">
        <button id="menubtn" aria-label="Menu">☰</button>
        <div class="pillrow" id="res"></div>
      </div>
      <div class="pillrow coins"><span class="coin"></span><b id="coins">0</b></div>
    </div>
    <div id="info">Depth <b id="depth">0 m</b> &nbsp;<span id="toolinfo"></span></div>
    <div id="toast"></div>
  </div>
  <div id="panel">
    <button id="upg" class="disp" aria-label="Open the trading post to sell ore and upgrade tools">⛏️ Upgrade</button>
    <div id="pad">
      <span></span>
      <button class="db" data-dir="0" aria-label="Dig up"><svg viewBox="0 0 24 24"><path d="M12 4l8 11H4z"/></svg></button>
      <span></span>
      <button class="db" data-dir="3" aria-label="Dig left"><svg viewBox="0 0 24 24"><path d="M12 4l8 11H4z"/></svg></button>
      <div id="ring"><span id="ringt"></span><button id="fillbtn" class="disp" aria-label="Fill the highlighted square">🧱</button></div>
      <button class="db" data-dir="1" aria-label="Dig right"><svg viewBox="0 0 24 24"><path d="M12 4l8 11H4z"/></svg></button>
      <span></span>
      <button class="db" data-dir="2" aria-label="Dig down"><svg viewBox="0 0 24 24"><path d="M12 4l8 11H4z"/></svg></button>
      <span></span>
    </div>
    <button id="supportbtn" class="disp" aria-label="Place a mine support here for 5 coins">🪵 Support · 5</button>
    <button id="buildbtn" class="disp" aria-label="Switch to build mode">🧱 Build</button>
    <div id="matpick" hidden>
      <button id="matdirt" class="buy sm" aria-label="Fill with dirt">🟫 Dirt</button>
      <button id="matstone" class="buy sm" aria-label="Fill with stone">⬜ Stone</button>
    </div>
  </div>
</div>

<div id="modal" hidden>
  <div class="sheet" role="dialog" aria-label="Trading post">
    <header>
      <h2 class="disp">Trading Post</h2>
      <div class="coins bigcoins"><span class="coin"></span><b id="scoins" class="disp">0</b></div>
      <button id="close" aria-label="Close">✕</button>
    </header>
    <div class="cols">
      <section>
        <h3>Sell ore <small>· tap one to sell all of it</small></h3>
        <div id="sell"></div>
        <button id="sellall">Sell everything</button>
      </section>
      <section>
        <h3>Tools</h3>
        <div id="tools"></div>
        <h3 style="margin-top:10px">Surveying</h3>
        <button id="scanbtn" class="buy" style="width:100%;justify-content:center">🗺️ 21×21 area scan, centered on you · <span class="coin sm"></span>1000</button>
        <div id="detect" style="margin-top:6px"></div>
        <div id="floods"></div>
      </section>
    </div>
  </div>
</div>

<div id="menu" hidden>
  <div class="sheet" style="max-width:360px" role="dialog" aria-label="Menu">
    <header>
      <h2 class="disp">Neya's Mine</h2>
      <button id="menuclose" aria-label="Close">✕</button>
    </header>
    <div style="color:var(--muted);font-size:12px;margin:-6px 0 10px">Menu</div>
    <h3>Character</h3>
    <input id="menuname" type="text" maxlength="16" placeholder="Your name" style="width:100%;padding:9px;border-radius:10px;border:2px solid var(--wood-ln);background:#2a1c12;color:var(--ink);font-size:15px;margin-bottom:8px;box-sizing:border-box">
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button id="menuboy" class="buy sm" style="flex:1;justify-content:center">👦 Boy</button>
      <button id="menugirl" class="buy sm" style="flex:1;justify-content:center">👧 Girl</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button id="refreshbtn" class="buy" style="justify-content:center;background:#4a90d9;box-shadow:0 3px 0 #2a63a6">🔄 Refresh app</button>
      <button id="newmine" class="buy" style="justify-content:center;background:#e0a838;box-shadow:0 3px 0 #9a6400">⛏️ Start a new mine</button>
      <button id="savefile" class="buy" style="justify-content:center">💾 Save to file</button>
      <button id="loadfilebtn" class="buy" style="justify-content:center;background:#5aa8d6;box-shadow:0 3px 0 #2a6d94">📂 Load from file</button>
      <button id="quitbtn" class="buy" style="justify-content:center;background:#c24a3a;box-shadow:0 3px 0 #7a2c20">🚪 Quit</button>
    </div>
    <input type="file" id="loadinput" accept="application/json" style="display:none">
  </div>
</div>

<div id="splash" hidden>
  <div class="sheet" style="max-width:380px;text-align:center">
    <h1 class="disp" style="font-size:32px;margin:0 0 4px">Neya's Mine</h1>
    <div style="color:var(--muted);margin-bottom:14px">Who's digging today?</div>
    <input id="nameinput" type="text" placeholder="Your name" maxlength="16" style="width:100%;padding:10px;border-radius:10px;border:2px solid var(--wood-ln);background:#2a1c12;color:var(--ink);font-size:16px;margin-bottom:10px;box-sizing:border-box;text-align:center">
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button id="genderboy" class="buy" style="flex:1;justify-content:center">👦 Boy</button>
      <button id="gendergirl" class="buy" style="flex:1;justify-content:center;background:#d888b0;box-shadow:0 3px 0 #a35c86">👧 Girl</button>
    </div>
    <button id="startbtn" class="disp" style="width:100%;border:none;border-radius:14px;padding:10px;background:linear-gradient(#ffd54a,#f0a800);color:var(--lamp-ink);font-size:18px;box-shadow:0 4px 0 #9a6400">⛏️ Start Digging</button>
  </div>
</div>

<script>
(()=>{
const SCREEN_W=14, SCREENS=7, SPAWN_SCREEN=3; // 3 screens left of spawn, 3 right, spawn in the middle
const W=SCREEN_W*SCREENS, D=160, SKY=3;
const EMPTY=0, EARTH=1, BEDROCK=2, ROCK=8, WATER=9, WALL=10, STONE=13;
const UP=0, RIGHT=1, DOWN=2, LEFT=3;
const DX=[0,1,0,-1], DY=[-1,0,1,0];
const ORES=[
  {id:'coal',     key:3,  name:'Coal',     value:8,   c:'#2c2b31', h:'#8a8a96', gem:false, sparkle:false},
  {id:'iron',     key:4,  name:'Iron',     value:15,  c:'#a9785c', h:'#f0d2bd', gem:false, sparkle:false},
  {id:'copper',   key:5,  name:'Copper',   value:25,  c:'#cf6a26', h:'#ffb57a', gem:false, sparkle:false},
  {id:'silver',   key:11, name:'Silver',   value:40,  c:'#b9c2c9', h:'#f2f6f8', gem:false, sparkle:false},
  {id:'gold',     key:6,  name:'Gold',     value:60,  c:'#f0b30a', h:'#fff38a', gem:false, sparkle:true},
  {id:'platinum', key:12, name:'Platinum', value:120, c:'#8fa3ad', h:'#e8f3f7', gem:false, sparkle:true},
  {id:'diamond',  key:7,  name:'Diamond',  value:200, c:'#3fcfe8', h:'#eaffff', gem:true,  sparkle:true},
];
const OREBY={}; ORES.forEach(o=>OREBY[o.key]=o);
const ORECFG={
  coal:{w:85,d0:1, d1:95,s0:4,s1:9}, iron:{w:60,d0:6, d1:D,s0:3,s1:7}, copper:{w:45,d0:14,d1:D,s0:3,s1:6},
  silver:{w:35,d0:10,d1:D,s0:2,s1:5}, gold:{w:30,d0:28,d1:D,s0:2,s1:5},
  platinum:{w:16,d0:45,d1:D,s0:1,s1:4}, diamond:{w:18,d0:55,d1:D,s0:1,s1:3},
};
const OREDEF=ORES.map(o=>({k:o.key,...ORECFG[o.id]}));
const TOOLS=[
  {name:'Shovel',           levels:[{time:10, price:0}]},
  {name:'Pickaxe',          levels:[{time:7,  price:200},{time:6.5,price:66}, {time:5.5,price:66}]},
  {name:'Jackhammer',       levels:[{time:5,  price:1000},{time:4.5,price:330},{time:3.5,price:330}]},
  {name:'Drilling Machine', levels:[{time:3,  price:5000},{time:2.5,price:1650},{time:1.5,price:1650}]},
];
const curTime=i=>S.dur[i]>0?TOOLS[i].levels[S.dur[i]-1].time:Infinity;
const KEY='deepdig-save-v1';
const IDB_NAME='deepdig-db', IDB_STORE='saves';
function idbOpen(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('no indexeddb')); return; }
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{ if(!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE); };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbGet(key){
  const db=await idbOpen();
  return new Promise((resolve,reject)=>{
    const rq=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(key);
    rq.onsuccess=()=>resolve(rq.result); rq.onerror=()=>reject(rq.error);
  });
}
async function idbSet(key,value){
  const db=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(value,key);
    tx.oncomplete=()=>resolve(true); tx.onerror=()=>reject(tx.error);
  });
}
const $=id=>document.getElementById(id);

let S=null;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hsh(x,y,k){let n=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(k,1442695041))|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- world generation ---------- */
function genMine(){
  const rnd=mulberry32((Math.random()*2147483647)|0);
  const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  const g=new Uint8Array(W*D).fill(EARTH);
  for(let x=0;x<W;x++) g[x+(D-1)*W]=BEDROCK;
  const spawnCol=SPAWN_SCREEN*SCREEN_W+(SCREEN_W>>1);
  function carve(k,x,y,size){
    const cells=[[x,y]]; g[x+y*W]=k; let dir=ri(0,3);
    for(let n=0;n<size*4&&cells.length<size;n++){
      const b=rnd()<0.6?cells[cells.length-1]:cells[ri(0,cells.length-1)];
      if(rnd()<0.35) dir=ri(0,3);
      const nx=b[0]+DX[dir], ny=b[1]+DY[dir];
      if(nx<0||nx>=W||ny<0||ny>=D-1||g[nx+ny*W]!==EARTH) continue;
      g[nx+ny*W]=k; cells.push([nx,ny]);
    }
    return cells;
  }
  const WR=W/40; // scale ore density to the wider map
  const fossils=[];
  const totalVeins=Math.round(OREDEF.reduce((a,o)=>a+o.w,0)*WR);
  for(let n=0;n<totalVeins;n++){
    const y=ri(1,D-2), elig=OREDEF.filter(o=>y>=o.d0&&y<=Math.min(o.d1,D-2));
    if(!elig.length) continue;
    const weights=elig.map(o=>o.w), sum0=weights.reduce((a,b)=>a+b,0);
    // every 10m of depth shifts 5% more of the odds from coal onto everything pricier than it
    const bonus=Math.min(0.85,Math.floor(y/10)*0.05), ci=elig.findIndex(o=>o.k===3);
    if(ci>=0&&elig.length>1){
      const othersW=sum0-weights[ci], shiftAmt=Math.min(weights[ci],bonus*sum0);
      if(othersW>0&&shiftAmt>0){
        weights[ci]-=shiftAmt;
        for(let j=0;j<weights.length;j++) if(j!==ci) weights[j]+=shiftAmt*(elig[j].w/othersW);
      }
    }
    let r=rnd()*weights.reduce((a,b)=>a+b,0), pick=elig[elig.length-1];
    for(let j=0;j<elig.length;j++){ if(r<weights[j]){pick=elig[j];break;} r-=weights[j]; }
    // density & vein length both grow ~2% per meter of depth
    const depthFactor=1+0.02*y;
    const size=Math.max(1,Math.round(ri(pick.s0,pick.s1)*depthFactor));
    const vx=ri(0,W-1);
    const cells=carve(pick.k, vx, y, size);
    if(pick.k===3 && cells.length && rnd()<0.13){ // occasional fossil near a coal seam
      const [cx0,cy0]=cells[ri(0,cells.length-1)];
      const nb=[[cx0-1,cy0],[cx0+1,cy0],[cx0,cy0-1],[cx0,cy0+1]].filter(([nx,ny])=>nx>=0&&nx<W&&ny>=0&&ny<D-1&&g[nx+ny*W]===EARTH);
      if(nb.length){ const [fx,fy]=nb[ri(0,nb.length-1)]; fossils.push({idx:fx+fy*W}); }
    }
    if(rnd()<Math.min(0.6,0.02*y)){ // deeper ground is also more likely to grow a second vein right alongside
      const y2=clamp(y+ri(-2,2),1,D-2);
      carve(pick.k, clamp(vx+ri(-3,3),0,W-1), y2, Math.max(1,Math.round(ri(pick.s0,pick.s1)*depthFactor*.6)));
    }
  }
  // groundwater pockets, sealed behind an impenetrable rock shell
  const pockets=[];
  const POCKET_TRIES=Math.round(W*D/60); // dense enough that a shell wall shows up roughly every ~15-20 blocks you dig
  for(let p=0;p<POCKET_TRIES;p++){
    const py0=ri(15,D-8), px0=ri(2,W-3);
    if(Math.abs(px0-spawnCol)<5) continue;
    const size=ri(1,10);
    const cells=[[px0,py0]]; let dir=ri(0,3);
    for(let n=0;n<size*5&&cells.length<size;n++){
      const b=rnd()<0.6?cells[cells.length-1]:cells[ri(0,cells.length-1)];
      if(rnd()<0.35) dir=ri(0,3);
      const nx=b[0]+DX[dir], ny=b[1]+DY[dir];
      if(nx<1||nx>=W-1||ny<1||ny>=D-2||g[nx+ny*W]!==EARTH) continue;
      if(cells.some(c=>c[0]===nx&&c[1]===ny)) continue;
      cells.push([nx,ny]);
    }
    if(!cells.length) continue;
    const cellIdx=cells.map(([x,y])=>x+y*W), cellSet=new Set(cellIdx), shellSet=new Set();
    cells.forEach(([x,y])=>{
      [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].forEach(([nx,ny])=>{
        if(nx<0||nx>=W||ny<0||ny>=D-1) return;
        const i2=nx+ny*W; if(!cellSet.has(i2)&&g[i2]===EARTH) shellSet.add(i2);
      });
    });
    if(!shellSet.size) continue;

    const shuffled=[...cellIdx];
    for(let i=shuffled.length-1;i>0;i--){ const j=ri(0,i); [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]; }
    const diamondCount=Math.min(shuffled.length, clamp(Math.ceil(size/3),1,4));
    const ore=shuffled.slice(0,diamondCount).map(i=>({x:i%W,y:(i/W)|0,k:7}));
    const id=pockets.length;
    cellIdx.forEach(i=>g[i]=WATER);
    shellSet.forEach(i=>g[i]=WALL);
    ore.forEach(o=>g[o.x+o.y*W]=o.k);
    pockets.push({id,cells:cellIdx,shell:[...shellSet],ore,y:py0,breached:false,drained:false,floodedCells:[],pumpCost:0});
  }
  // random impenetrable boulders scattered through the dirt
  const rockTries=Math.round(W*D*0.0045);
  for(let i=0;i<rockTries;i++){
    const x=ri(0,W-1), y=ri(4,D-2);
    if(g[x+y*W]!==EARTH) continue;
    carve(ROCK,x,y,ri(1,3));
  }
  const sx=spawnCol;
  for(let x=0;x<W;x++) g[x]=EMPTY; // surface row: a clear walkway, no digging needed to move along it
  [[sx-2,1],[sx-2,2],[sx-3,2],[sx-2,3]].forEach(([x,y])=>g[x+y*W]=3);
  [[sx+2,3],[sx+3,3],[sx+3,4]].forEach(([x,y])=>g[x+y*W]=4);
  return {g,sx,pockets,fossils};
}

async function save(){

function migrateOwned(o){
  if(!Array.isArray(o)) return [1,0,0,0];
  if(o.length>=4) return o; // already the current 4-tool format

async function load(){try{

    const raw=localStorage.getItem(KEY);

  }

    name:d.name||'', gender:d.gender||'boy', mine:d.mine||1};

  for(let i=0;i<W*D;i++){g[i]=d.g.charCodeAt(i)-48;r[i]=d.r.charCodeAt(i)-48;}
  S={grid:g,rev:r,px:d.px,py:d.py,inv:normInv(d.inv),coins:d.coins,tool:d.tool,owned:ownedMig,
     dur:d.dur||ownedMig.map(x=>x>0?x:0), wear:d.wear||[0,0,0,0], detectLvl:d.detectLvl||0,

     pockets:d.pockets||[], flooded:new Set(d.flooded||[]), supports:new Map((d.supports||[]).map(e=>Array.isArray(e)?e:[e,1])),

const STOPS=[[0,[139,94,55]],[20,[116,76,45]],[45,[104,88,74]],[85,[88,85,88]],[160,[56,52,66]]];
const ROWC=[],ROWD=[],ROWL=[],ROWT=[];

for(let y=0;y<D;y++){
  let i=0; while(i<STOPS.length-2&&y>STOPS[i+1][0]) i++;
  const [a,ca]=STOPS[i],[b,cb]=STOPS[i+1],t=clamp((y-a)/(b-a),0,1);

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();c.fill();}

/* ---------- surface: 7 screens (3 left of spawn, spawn, 3 right), each a different biome ---------- */
const BIOME=['quarry','forest','farm','town','meadow','forest','quarry'];
const HOUSES=[], TREES=[], ROCKS=[], FENCES=[], STACKS=[];
for(let s=0;s<SCREENS;s++){
  const biome=BIOME[s], base=s*SCREEN_W;
  for(let i=0;i<SCREEN_W;i++){
    const col=base+i, h=hsh(col,0,501);
    if(biome==='town'){
      if(i%4===1&&h<0.85) HOUSES.push([col,Math.floor(hsh(col,1,502)*3)]);
      else if(h<0.55) TREES.push([col+hsh(col,2,503)*.4-.2,h<0.28?0:1]);
    } else if(biome==='forest'){
      if(h<0.78) TREES.push([col+hsh(col,2,503)*.3-.15,hsh(col,3,504)<0.5?0:1]);
    } else if(biome==='farm'){
      if(i%5===0) FENCES.push(col);
      else if(h<0.22) STACKS.push(col);
      else if(h<0.4) TREES.push([col,1]);
    } else if(biome==='meadow'){
      if(h<0.3) TREES.push([col,1]);
      else if(h<0.42) STACKS.push(col);
    } else if(biome==='quarry'){
      if(h<0.55) ROCKS.push([col,.45+hsh(col,4,505)*.5]);
      else if(h<0.65) TREES.push([col,0]);
    }
  }
}
function drawSky(now){
  const gy=SKY*cs, ww=W*cs;
  ctx.fillStyle='rgba(255,243,176,.35)'; circ(ctx,ww*.62,gy*.32,cs*.9);
  ctx.fillStyle='#fff3b0'; circ(ctx,ww*.62,gy*.32,cs*.55);
  for(let i=0;i<7;i++){
    const sp=cs*(0.15+(i%3)*0.07), span=ww+6*cs;
    const x=((i*span/7+now*0.001*sp)%span)-3*cs, y=gy*(0.14+(i%3)*0.12), r=cs*(0.32+(i%2)*0.12);
    ctx.fillStyle='rgba(255,255,255,.92)'; circ(ctx,x,y,r); circ(ctx,x+r*.9,y+r*.2,r*.8); circ(ctx,x-r*.9,y+r*.25,r*.7); rr(ctx,x-r*1.5,y+r*.2,r*3.2,r*.75,r*.35);
  }
  ctx.fillStyle='#9fd68f'; ctx.beginPath(); ctx.moveTo(0,gy);
  for(let x=0;x<=ww;x+=cs/2) ctx.lineTo(x,gy-cs*.5-Math.sin(x/(cs*3.1))*cs*.28-Math.sin(x/(cs*1.3))*cs*.08);

  STACKS.forEach(c=>stack((c+.5)*cs,gy));
  HOUSES.forEach(([c,v])=>house((c+.5)*cs,gy,v));

// action — walk, dig, or (in build mode) place. Holding a direction down auto-repeats it,

function doAct(dir){

  const nx=S.px+DX[dir], ny=S.py+DY[dir];
  if(ny<0){ toast("That's the surface up there — dig down!"); return; }

function checkCollapse(x,y){

  while(hi+1<W && S.grid[(hi+1)+y*W]===EMPTY && !S.supports.has((hi+1)+y*W) && !S.flooded.has((hi+1)+y*W)) hi++;
  const len=hi-lo+1;

  const chance=Math.min(.6,.05*(len-5));
  if(Math.random()>=chance) return;

  do{ c=lo+Math.floor(Math.random()*len); tries++; } while(c===S.px&&y===S.py&&tries<20);
  if(c===S.px&&y===S.py) return;

function breachPocket(pid,x,y,now){

    const el=$('ri-'+o.id); if(el){el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');}
  }
  S.grid[idx]=EMPTY;
  moveTo(d.x,d.y,now);
  S.wear[S.tool]++;
  if(S.wear[S.tool]>=33){
    S.wear[S.tool]=0;
    if(S.dur[S.tool]>1){ S.dur[S.tool]--; toast(`${TOOLS[S.tool].name} is wearing down — ${curTime(S.tool)}s per block now.`,2600); }
    else { S.dur[S.tool]=0; toast(`${TOOLS[S.tool].name} broke down!`,2600); autoSwitchTool(); }
  }
  checkCollapse(d.x,d.y);
  save();
}
function findPath(sx0,sy0,tx0,ty0){
  const startIdx=sx0+sy0*W, targetIdx=tx0+ty0*W;
  if(startIdx===targetIdx) return [];
  const visited=new Uint8Array(W*D); visited[startIdx]=1;
  const prev=new Int32Array(W*D).fill(-1);
  const q=[startIdx]; let qi=0, found=false, nodes=0;
  while(qi<q.length && nodes<8000){
    const cur=q[qi++]; nodes++;
    if(cur===targetIdx){found=true;break;}
    const cx=cur%W, cy=(cur/W)|0;
    for(let d2=0;d2<4;d2++){
      const nx=cx+DX[d2], ny=cy+DY[d2]; if(nx<0||nx>=W||ny<0||ny>=D) continue;
      const ni=nx+ny*W; if(visited[ni]||S.grid[ni]!==EMPTY||S.flooded.has(ni)) continue;
      visited[ni]=1; prev[ni]=cur; q.push(ni);
      if(ni===targetIdx){found=true;qi=q.length;break;}
    }
  }
  if(!found) return null;
  const path=[]; let cur=targetIdx;
  while(cur!==startIdx){ path.push([cur%W,(cur/W)|0]); cur=prev[cur]; if(cur===-1) return null; }
  path.reverse();
  return path;
}
function update(now,dt){
  if(S.dig){
    const d=S.dig, p=(now-d.start)/d.dur;
    if(Math.random()<.22+S.tool*.25){
      const ex=(S.px+.5+DX[d.dir]*.5)*cs, ey=(SKY+S.py+.5+DY[d.dir]*.5)*cs;
      dust(ex,ey,cellColor(d.x,d.y),1,false);
    }
    if(p>=1) finishDig(now);
  }
  if(anim&&now-anim.t0>=anim.dur){
    anim=null; const q=queued; queued=null;
    if(q!==null) pressDir(q);
    else if(held!==null) pressDir(held);
    else if(walkPath&&walkPath.length){
      const [nx,ny]=walkPath.shift();
      if(S.grid[nx+ny*W]===EMPTY && !S.flooded.has(nx+ny*W)) moveTo(nx,ny,now);
      else { walkPath=null; toast('Path blocked'); }
    }
  }
  const g=cs*9;
  parts=parts.filter(p=>{p.t+=dt;p.vy+=g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;return p.t<p.life;});
  floats=floats.filter(f=>now-f.t0<1300);
  const ring=$('ring'), rt=$('ringt');
  if(S.dig){const p=clamp((now-S.dig.start)/S.dig.dur,0,1);ring.style.background=`conic-gradient(#ffc21a ${p*360}deg, rgba(0,0,0,.3) 0)`;rt.textContent=Math.ceil((1-p)*S.dig.dur/1000)+'s';}
  else if(rt.textContent){ring.style.background='rgba(0,0,0,.25)';rt.textContent='';}
  if(longPress&&now-longPress.t0>=5000){toggleDevReveal();longPress=null;}
}
function playerPos(now){
  if(!anim) return [S.px,S.py];
  const p=Math.min(1,(now-anim.t0)/anim.dur), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  return [anim.fx+(anim.tx-anim.fx)*e, anim.fy+(anim.ty-anim.fy)*e];
}
function render(now,dt){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#120b07'; ctx.fillRect(0,0,vw,vh);
  const [rx,ry]=playerPos(now);
  if(followCam){ cam.x=(rx+.5)*cs-vw/2; cam.y=(SKY+ry+.5)*cs-vh/2; camInit=true; }
  ctx.translate(-Math.round(cam.x),-Math.round(cam.y));

  const gyl=SKY*cs;
  if(cam.y<gyl){const g=ctx.createLinearGradient(0,0,0,gyl);g.addColorStop(0,'#58b1ee');g.addColorStop(1,'#c8ebff');ctx.fillStyle=g;ctx.fillRect(cam.x-2,cam.y-2,vw+4,gyl-cam.y+2);}
  ctx.fillStyle='#231f29';
  if(cam.x<0) ctx.fillRect(cam.x-2,Math.max(gyl,cam.y),-cam.x+2,vh+4);
  if(cam.x+vw>W*cs) ctx.fillRect(W*cs,Math.max(gyl,cam.y),cam.x+vw-W*cs+2,vh+4);
  if(cam.y<gyl) drawSky(now);
  const c0=Math.max(0,Math.floor(cam.x/cs)), c1=Math.min(W-1,Math.floor((cam.x+vw)/cs));
  const r0=Math.max(0,Math.floor(cam.y/cs)-SKY), r1=Math.min(D-1,Math.floor((cam.y+vh)/cs)-SKY);
  for(let y=r0;y<=r1;y++) for(let x=c0;x<=c1;x++) drawCell(x,y,now);
  if(cam.y<SKY*cs+cs) drawGrass();

  if(buildMode){
    const hx=S.px+DX[aim], hy=S.py+DY[aim];
    if(hx>=0&&hx<W&&hy>=0&&hy<D){
      const X=hx*cs, Y=(SKY+hy)*cs, fillable=S.grid[hx+hy*W]===EMPTY&&!S.flooded.has(hx+hy*W);
      ctx.save();
      if(fillable){ ctx.fillStyle='rgba(255,255,255,.16)'; ctx.fillRect(X,Y,cs,cs); }
      ctx.strokeStyle=fillable?'rgba(255,255,255,.95)':'rgba(255,255,255,.35)';
      ctx.lineWidth=cs*.07; ctx.strokeRect(X+cs*.035,Y+cs*.035,cs*.93,cs*.93);
      ctx.restore();
    }
  }
  if(S.dig){
    const d=S.dig, p=clamp((now-d.start)/d.dur,0,1), X=d.x*cs, Y=(SKY+d.y)*cs;
    ctx.fillStyle=`rgba(0,0,0,${p*.22})`; ctx.fillRect(X,Y,cs,cs);
    ctx.strokeStyle='rgba(22,10,4,.8)'; ctx.lineWidth=cs*.05; ctx.lineCap='round';
    const st=Math.min(4,Math.floor(p*5));
    for(let i=0;i<st;i++) CRACKS[i].forEach(([a,b,c,e])=>{ctx.beginPath();ctx.moveTo(X+a*cs,Y+b*cs);ctx.lineTo(X+c*cs,Y+e*cs);ctx.stroke();});
    const bw=cs*.78,bx=X+(cs-bw)/2,by=Y+cs*.07,bh=Math.max(4,cs*.12);
    ctx.fillStyle='rgba(0,0,0,.65)'; rr(ctx,bx-1.5,by-1.5,bw+3,bh+3,bh/2+1);
    ctx.fillStyle='#ffc21a'; if(p>0.02) rr(ctx,bx,by,bw*p,bh,bh/2);
  }
  parts.forEach(p=>{ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);});
  ctx.globalAlpha=1;
  drawMiner((rx+.5)*cs,(SKY+ry+.5)*cs,now);
  if(ping){
    const k=(now-ping)/900;
    if(k<1){
      const px=(rx+.5)*cs,py=(SKY+ry+.5)*cs;
      ctx.strokeStyle=`rgba(74,144,217,${1-k})`; ctx.lineWidth=cs*.08;
      ctx.beginPath(); ctx.arc(px,py-cs*.15,cs*(.6+k*1.6),0,Math.PI*2); ctx.stroke();
    } else ping=null;
  }
  if(longPress){
    const k=clamp((now-longPress.t0)/5000,0,1), px=(rx+.5)*cs, py=(SKY+ry+.5)*cs;
    ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=cs*.11;
    ctx.beginPath(); ctx.arc(px,py-cs*.15,cs*.85,-Math.PI/2,-Math.PI/2+Math.PI*2*k); ctx.stroke();
    ctx.strokeStyle='#ffc21a'; ctx.lineWidth=cs*.09;
    ctx.beginPath(); ctx.arc(px,py-cs*.15,cs*.85,-Math.PI/2,-Math.PI/2+Math.PI*2*k); ctx.stroke();
  }
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font=`${Math.round(cs*.36)}px "Lilita One","Arial Black",sans-serif`; ctx.lineWidth=cs*.1; ctx.lineJoin='round';
  floats.forEach(f=>{const k=(now-f.t0)/1300;ctx.globalAlpha=1-k*k;const y=f.y-k*cs*.9;ctx.strokeStyle='#1a0f07';ctx.strokeText(f.text,f.x,y);ctx.fillStyle=f.col;ctx.fillText(f.text,f.x,y);});
  ctx.globalAlpha=1;
}

  const gx=Math.floor((px+cam.x)/cs), gyw=Math.floor((py+cam.y)/cs), gy=gyw-SKY;
  if(gx<0||gx>=W||gy<0||gy>=D) return;
  if(gx===S.px&&gy===S.py) return;
  if(S.grid[gx+gy*W]!==EMPTY||S.flooded.has(gx+gy*W)){toast("You'll need to dig your way there first."); return;}
  const path=findPath(S.px,S.py,gx,gy);
  if(!path){toast("Can't find a path there through what you've already dug."); return;}
  walkPath=path; followCam=true; held=null;
  if(!anim && walkPath.length){ const [nx,ny]=walkPath.shift(); moveTo(nx,ny,performance.now()); }
}
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,e=>{
  longPress=null;
  if(gesture&&!gesture.moved&&!gesture.onPlayer&&!modalOpen) tapToWalk(gesture.lastX,gesture.lastY);
  gesture=null;
}));
cv.addEventListener('pointerleave',()=>{longPress=null; gesture=null;});
document.querySelectorAll('.db').forEach(b=>{
  const d=+b.dataset.dir;
  b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}held=d;b.classList.add('on');pressDir(d);});
  const up=()=>{if(held===d)held=null;b.classList.remove('on');};
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,up));
  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pressDir(d);}});
});
const KEYS={ArrowUp:UP,w:UP,W:UP,ArrowRight:RIGHT,d:RIGHT,D:RIGHT,ArrowDown:DOWN,s:DOWN,S:DOWN,ArrowLeft:LEFT,a:LEFT,A:LEFT};
window.addEventListener('keydown',e=>{
  if(modalOpen){if(e.key==='Escape'){if(!$('modal').hidden)closeShop();else if(!$('menu').hidden)closeMenu();}return;}
  if(e.key==='u'||e.key==='U'){openShop();return;}
  if(e.key==='b'||e.key==='B'){toggleBuildMode();return;}
  if((e.key==='f'||e.key==='F')&&buildMode){fillHighlighted();return;}
  const d=KEYS[e.key]; if(d===undefined) return; e.preventDefault();
  if(e.repeat) return; held=d; pressDir(d);
});
window.addEventListener('keyup',e=>{const d=KEYS[e.key];if(d!==undefined&&held===d)held=null;});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- splash: first-time name & character pick ---------- */
let splashGender='boy';
function setSplashGender(g){splashGender=g;$('genderboy').classList.toggle('sel',g==='boy');$('gendergirl').classList.toggle('sel',g==='girl');}
$('genderboy').addEventListener('click',()=>setSplashGender('boy'));
$('gendergirl').addEventListener('click',()=>setSplashGender('girl'));
$('startbtn').addEventListener('click',()=>{
  S.name=$('nameinput').value.trim().slice(0,16); S.gender=splashGender; save();
  $('splash').hidden=true; modalOpen=false;
});

/* ---------- boot ---------- */
(async()=>{
  const hadSave=await load();
  if(hadSave===true){/* loaded fully */}
  else if(hadSave){newGame(hadSave,true); toast('Your mine map was updated — coins and tools carried over.',3200);}
  else newGame(null);
  resize(); updateHUD();
  if(!S.name){ setSplashGender('boy'); $('splash').hidden=false; modalOpen=true; }
  else if(!hadSave) setTimeout(()=>toast('Tap an arrow to start digging',3000),400);
  let last=performance.now();
  function frame(now){
    if(quitting) return;
    const dt=Math.min(.05,(now-last)/1000);last=now;update(now,dt);render(now,dt);requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      if(reg.waiting) reg.waiting.postMessage('skip');
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        nw && nw.addEventListener('statechange',()=>{
          if(nw.state==='installed' && navigator.serviceWorker.controller) nw.postMessage('skip');
        });
      });
      setInterval(()=>reg.update(),60000);
    }).catch(e=>console.warn('Service worker failed:',e));
    let refreshed=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(refreshed) return; refreshed=true; location.reload();
    });
  });
}
</script>
</body>

        * { box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        body, html { background-color: #050505; height: 100vh; width: 100vw; margin: 0; font-family: 'Share Tech Mono', monospace; overflow: hidden; position: fixed; }
        .display-area { background: #010808; position: absolute; top: 0; left: 0; width: 100%; height: 45vh; padding: 15px; display: flex; flex-direction: column; z-index: 10; }
        .display-area::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.7) 70%); background-size: 2px 2px; pointer-events: none; z-index: 20; }
        .history-viewport { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; scroll-behavior: smooth; }
        #history-container { margin-top: auto; display: flex; flex-direction: column; }
        
        .history-item { 
            display: flex; flex-direction: column; align-items: stretch; justify-content: center; 
            min-height: 55px; padding: 8px 15px; margin: 2px 0; font-size: 1.2rem; 
            color: #26bf9e; flex-shrink: 0; transition: background 0.2s ease; word-break: break-all; 
        }
        .history-item span:first-child { align-self: flex-start; text-align: left; line-height: 1.2; margin-bottom: 4px; }
        .history-item span:last-child { align-self: flex-end; text-align: right; font-weight: bold; color: #33ffcc; }
        .history-item.selected { color: #004d40 !important; background: #33ffcc; border-radius: 4px; box-shadow: 0 0 15px rgba(51, 255, 204, 0.6); }

<body tabindex="-1">

    <div class="display-area">

    </div>

        <button data-val="7">7</button><button data-val="8">8</button><button data-val="9">9</button><button data-val="*">×</button>
        <button data-val="4">4</button><button data-val="5">5</button><button data-val="6">6</button><button data-val="-">-</button>
        <button data-val="1">1</button><button data-val="2">2</button><button data-val="3">3</button><button data-val="+">+</button>

        <button class="eq" data-val="="><span>⏎</span><span class="sub-label">Mem+</span></button>
    </div>
<script>
    // ============================================================
    // Application State
    // ============================================================
    let entryArr = [], cursorIdx = 0, lastAnswer = 0, shiftMode = false;
    // The exact expression string that was attempted right before a failed calculation
    // overwrote the entry line with "ERROR" - lets a following backspace restore it
    // instead of just nibbling at the literal "ERROR" text. Cleared as soon as the user
    // does anything else that changes the entry line, so it only applies right after an error.
    let preErrorEntry = null;
    let sciMode = localStorage.getItem('vfdSciMode') === 'true';
    let stickyMemory = localStorage.getItem('vfdStickyMemory') || "0";
    let historyIndex = -1, fullHistory = JSON.parse(localStorage.getItem('vfdHistory')) || [];
    let rndMode = false, currentRnd = parseInt(localStorage.getItem('vfdRnd')) || 9;
    let holdTimer, isHolding = false;

    const viewport = document.getElementById('viewport'), historyContainer = document.getElementById('history-container');
    const inputDisplay = document.getElementById('entry-inner'), statusTag = document.getElementById('status-tag');
    const memTag = document.getElementById('mem-tag'), notifTag = document.getElementById('notif-tag');

    // ============================================================
    // Haptics & Small UI Feedback Helpers
    // ============================================================
    function triggerHaptic(strong = false) { if (navigator.vibrate) navigator.vibrate(strong ? 15 : 1); }
    function updateStatus() { 
        statusTag.innerText = sciMode ? "SCI" : "RND " + currentRnd; 
        memTag.classList.toggle('active', stickyMemory !== "0");
    }
    function showNotif(text) { notifTag.innerText = text; setTimeout(() => { notifTag.innerText = ""; }, 1500); }

    // ============================================================
    // Value Formatting (decimal / scientific / fraction display)
    // ============================================================
    function formatVal(val) {
        if (isNaN(val) && typeof val !== 'string') return val;
        if (typeof val === 'string' && val.includes('/')) return val;
        if (sciMode) return (Number(val) === 0) ? "0.0000e+0" : Number(val).toExponential(4);
        return Number(val).toFixed(currentRnd).replace(/\.?0+$/, "");
    }

    function getFractionMatrix(decimal) {
        let val = parseFloat(decimal);
        if (isNaN(val)) return { res: "0", ind: "" };
        let sign = val < 0 ? "-" : "";
        let absVal = Math.abs(val);
        let whole = Math.floor(absVal);
        let frac = absVal - whole;
        let rawNum = frac * 16, roundedNum = Math.round(rawNum);
        let finalWhole = (roundedNum === 16) ? whole + 1 : whole;
        let finalNum = (roundedNum === 16 || roundedNum === 0) ? 0 : roundedNum;
        const gcd = (a, b) => b ? gcd(b, a % b) : a;
        let fractionStr = (finalNum === 0) ? sign + finalWhole.toString() :
            sign + (finalWhole > 0 ? finalWhole + " " : "") + (finalNum/gcd(finalNum, 16)) + "/" + (16/gcd(finalNum, 16));
        // Decimal equivalent of the fraction just calculated (not of the original input),
        // rounded to 3 places, shown alongside it for reference.
        let decimalEquivalent = (sign === "-" ? -1 : 1) * (finalWhole + finalNum / 16);
        let indicator = decimalEquivalent.toFixed(3);
        return { res: fractionStr, ind: indicator, raw: val };
    }

    // ============================================================
    // History List Rendering
    // ============================================================
    function initHistory() {
        historyContainer.innerHTML = '';
        fullHistory.forEach((item) => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.setAttribute('data-ans', item.rawRes !== undefined ? item.rawRes : item.res);
            let indicatorHtml = item.ind ? `<span style="margin-left:8px; font-size:0.8em; opacity:0.8; color:#f5a623;">${item.ind}</span>` : "";
            div.innerHTML = `<span>${item.expr}</span><span>= ${formatVal(item.res)}${indicatorHtml}</span>`;
            historyContainer.appendChild(div);
        });
        viewport.scrollTop = viewport.scrollHeight;
        updateStatus();
    }

    // ============================================================
    // Calculation Engine — tokenizer -> Pratt/precedence-climbing
    // parser -> AST evaluator. No DOM or global state; everything
    // needed is passed in via the `ctx` argument to evaluate().
    // ============================================================
    const CalcEngine = (() => {
    
        // ---------- Tokenizer ----------
        // Keywords that open a function call (must be followed by '(').
        // Order doesn't matter for correctness here since none is a prefix of another,
        // but longer/more-specific ones are listed first defensively.
        const FUNC_KEYWORDS = ['ASIN', 'ACOS', 'ATAN', 'AVG', 'TAX', 'SIN', 'COS', 'TAN', 'LN'];
    
        function tokenize(str) {
            const tokens = [];
            let i = 0;
            const n = str.length;
            while (i < n) {
                const c = str[i];
                if (c === ' ') { i++; continue; }
                if (c >= '0' && c <= '9' || c === '.') {
                    let j = i;
                    let sawDot = false;
                    while (j < n && ((str[j] >= '0' && str[j] <= '9') || (str[j] === '.' && !sawDot))) {
                        if (str[j] === '.') sawDot = true;
                        j++;
                    }
                    const raw = str.slice(i, j);
                    const value = Number(raw === '.' ? 'NaN' : raw); // bare '.' is not a valid number
                    if (isNaN(value)) throw new CalcError(`Invalid number "${raw}"`);
                    tokens.push({ type: 'NUM', value });
                    i = j;
                    continue;
                }
                if (str.startsWith('ANS', i)) { tokens.push({ type: 'CONST_ANS' }); i += 3; continue; }
                if (c === 'π') { tokens.push({ type: 'CONST_PI' }); i += 1; continue; }
                if (c === 'e' && str[i + 1] === '^') { tokens.push({ type: 'CONST_E' }); i += 1; continue; } // '^' falls through next iteration
                let matchedFunc = null;
                for (const kw of FUNC_KEYWORDS) {
                    if (str.startsWith(kw, i)) { matchedFunc = kw; break; }
                }
                if (matchedFunc && str[i + matchedFunc.length] === '(') {
                    tokens.push({ type: 'FUNC', name: matchedFunc });
                    i += matchedFunc.length;
                    continue;
                }
                if (c === '√' && str[i + 1] === '(') { tokens.push({ type: 'FUNC', name: 'SQRT' }); i += 1; continue; }
                if ('+-*/^'.includes(c)) { tokens.push({ type: 'OP', op: c }); i++; continue; }
                if (c === '(') { tokens.push({ type: 'LPAREN' }); i++; continue; }
                if (c === ')') { tokens.push({ type: 'RPAREN' }); i++; continue; }
                throw new CalcError(`Unexpected character "${c}"`);
            }
            tokens.push({ type: 'EOF' });
            return tokens;
        }
    
        // ---------- Errors ----------
        class CalcError extends Error {}
    
        // ---------- Parser ----------
        // Grammar:
        //   expression := term (('+'|'-') term)*
        //   term       := unary (('*'|'/') unary)*
        //   unary      := ('-'|'+') unary | power
        //   power      := primary ('^' unary)?
        //   primary    := NUM | CONST_PI | CONST_ANS | CONST_E | '(' expression ')' | FUNC '(' funcArgs ')'
        //   funcArgs   := for AVG/TAX: avgPart ('+' avgPart)*   (a '+' here is an argument
        //                 separator, matching this app's existing AVG/TAX convention —
        //                 not addition; each part is its own full sub-expression)
        //                 avgPart := term (('-') term)*
        //                 for all other functions: a single `expression`
        function parse(tokens) {
            let pos = 0;
            const peek = () => tokens[pos];
            const next = () => tokens[pos++];
            function expect(type) {
                if (peek().type !== type) throw new CalcError(`Expected ${type} but got ${peek().type}`);
                return next();
            }
    
            function parseExpression() {
                let node = parseTerm();
                while (peek().type === 'OP' && (peek().op === '+' || peek().op === '-')) {
                    const op = next().op;
                    const right = parseTerm();
                    node = { type: 'BIN', op, left: node, right };
                }
                return node;
            }
    
            function parseTerm() {
                let node = parseUnary();
                while (true) {
                    if (peek().type === 'OP' && (peek().op === '*' || peek().op === '/')) {
                        const op = next().op;
                        const right = parseUnary();
                        node = { type: 'BIN', op, left: node, right };
                    } else if (startsImplicitFactor(peek())) {
                        // Implicit multiplication: "2π", "2(3+4)", "3ANS", "(1+2)(3+4)", "2SIN(30)".
                        // Binds at the same precedence as explicit '*' (so "2+3(4)" = 2+3*4 = 14,
                        // and "2π^2" = 2*(π^2), matching ordinary math convention).
                        const right = parseUnary();
                        node = { type: 'BIN', op: '*', left: node, right };
                    } else break;
                }
                return node;
            }

            function startsImplicitFactor(t) {
                return t.type === 'NUM' || t.type === 'CONST_PI' || t.type === 'CONST_E' ||
                       t.type === 'CONST_ANS' || t.type === 'LPAREN' || t.type === 'FUNC';
            }
    
            function parseUnary() {
                if (peek().type === 'OP' && (peek().op === '-' || peek().op === '+')) {
                    const op = next().op;
                    const operand = parseUnary();
                    return op === '-' ? { type: 'NEG', operand } : operand;
                }
                return parsePower();
            }
    
            function parsePower() {
                const base = parsePrimary();
                if (peek().type === 'OP' && peek().op === '^') {
                    next();
                    const exponent = parseUnary(); // right-assoc, and allows e.g. 2^-3
                    return { type: 'BIN', op: '^', left: base, right: exponent };
                }
                return base;
            }
    
            // For AVG/TAX: a part is like `expression` but treats top-level '+' as the
            // argument separator (handled by the caller), so a part only chains '-' itself.
            function parseAvgPart() {
                let node = parseTerm();
                while (peek().type === 'OP' && peek().op === '-') {
                    next();
                    const right = parseTerm();
                    node = { type: 'BIN', op: '-', left: node, right };
                }
                return node;
            }
    
            function parseFuncArgs(name) {
                if (name === 'AVG' || name === 'TAX') {
                    const parts = [parseAvgPart()];
                    while (peek().type === 'OP' && peek().op === '+') {
                        next();
                        parts.push(parseAvgPart());
                    }
                    return { type: name, parts };
                }
                const arg = parseExpression();
                return { type: name, arg };
            }
    
            function parsePrimary() {
                const t = peek();
                if (t.type === 'NUM') { next(); return { type: 'NUM', value: t.value }; }
                if (t.type === 'CONST_PI') { next(); return { type: 'NUM', value: Math.PI }; }
                if (t.type === 'CONST_E') { next(); return { type: 'NUM', value: Math.E }; }
                if (t.type === 'CONST_ANS') { next(); return { type: 'ANS' }; }
                if (t.type === 'LPAREN') {
                    next();
                    const node = parseExpression();
                    expect('RPAREN');
                    return node;
                }
                if (t.type === 'FUNC') {
                    next();
                    expect('LPAREN');
                    const node = parseFuncArgs(t.name);
                    expect('RPAREN');
                    return node;
                }
                throw new CalcError(`Unexpected token ${t.type}`);
            }
    
            const node = parseExpression();
            expect('EOF');
            return node;
        }
    
        // ---------- Evaluator ----------
        const D2R = Math.PI / 180, R2D = 180 / Math.PI;
    
        function evalNode(node, ctx) {
            switch (node.type) {
                case 'NUM': return node.value;
                case 'ANS': return ctx.ans;
                case 'NEG': return -evalNode(node.operand, ctx);
                case 'BIN': {
                    const a = evalNode(node.left, ctx), b = evalNode(node.right, ctx);
                    switch (node.op) {
                        case '+': return a + b;
                        case '-': return a - b;
                        case '*': return a * b;
                        case '/': return a / b;
                        case '^': return Math.pow(a, b);
                    }
                }
                case 'SQRT': return Math.sqrt(evalNode(node.arg, ctx));
                case 'SIN': return Math.sin(D2R * evalNode(node.arg, ctx));
                case 'COS': return Math.cos(D2R * evalNode(node.arg, ctx));
                case 'TAN': return Math.tan(D2R * evalNode(node.arg, ctx));
                case 'ASIN': return Math.asin(evalNode(node.arg, ctx)) * R2D;
                case 'ACOS': return Math.acos(evalNode(node.arg, ctx)) * R2D;
                case 'ATAN': return Math.atan(evalNode(node.arg, ctx)) * R2D;
                case 'LN': return Math.log(evalNode(node.arg, ctx));
                case 'AVG': {
                    const vals = node.parts.map(p => evalNode(p, ctx));
                    return vals.reduce((a, b) => a + b, 0) / vals.length;
                }
                case 'TAX': {
                    const vals = node.parts.map(p => evalNode(p, ctx));
                    return vals.reduce((a, b) => a + b, 0) * 0.06;
                }
                default: throw new CalcError(`Unknown node type ${node.type}`);
            }
        }
    
        // Auto-close unmatched '(' the same way the previous implementation did,
        // as a UX convenience (you don't have to always press the closing paren).
        function autoCloseParens(str) {
            let open = 0;
            for (const c of str) { if (c === '(') open++; else if (c === ')') open--; }
            while (open > 0) { str += ')'; open--; }
            return str;
        }
    
        function evaluate(exprStr, ctx = { ans: 0 }) {
            try {
                const str = autoCloseParens(exprStr);
                const tokens = tokenize(str);
                const ast = parse(tokens);
                const value = evalNode(ast, ctx);
                return { ok: true, value };
            } catch (err) {
                if (err instanceof CalcError) return { ok: false, error: err.message };
                return { ok: false, error: 'Unexpected error: ' + err.message };
            }
        }
    
        return { evaluate, tokenize, parse, CalcError };
    })();

    // Turns an engine error into a short label for the notification tag (the main
    // display keeps showing the plain "ERROR" text as before; this just adds a bit
    // more diagnostic detail alongside it without changing the display's look).
    function humanizeCalcError(message) {
        if (/EOF/.test(message)) return 'INCOMPLETE EXPR';
        if (/Invalid number/.test(message)) return 'BAD NUMBER';
        return 'SYNTAX ERROR';
    }

    // ============================================================
    // Entry Line Rendering (cursor, digit display, mode labels)
    // ============================================================
    function renderEntry() {
        let left = entryArr.slice(0, cursorIdx).join('');
        let atChar = entryArr[cursorIdx]; // character sitting at the cursor, if any
        let right = entryArr.slice(cursorIdx + (atChar !== undefined ? 1 : 0)).join('');
        let midHtml = '', trailingHtml = '';
        if (historyIndex === -1) {
            if (atChar !== undefined) {
                midHtml = `<span id="active-cursor" class="char-cursor">${atChar}</span>`;
                trailingHtml = '<span class="cursor-slot"></span>'; // invisible spacer, keeps width constant
            } else {
                trailingHtml = '<span id="active-cursor" class="cursor"></span>';
            }
        }
        inputDisplay.innerHTML = `<span class="entry-part">${left}</span>` + midHtml + `<span class="entry-part">${right}</span>` + trailingHtml;
        inputDisplay.style.opacity = (historyIndex !== -1) ? '0.4' : '1';
        setTimeout(() => { document.getElementById('active-cursor')?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); }, 10);
        
        const btns = { ans: document.getElementById('ansBtn'), ac: document.getElementById('acBtn'), rnd: document.getElementById('rndBtn'), sqrt: document.getElementById('sqrtBtn') };
        btns.ans.querySelector('span:first-child').innerText = shiftMode ? 'SCI' : 'ANS';
        btns.ans.classList.toggle('sci-active', sciMode);
        btns.rnd.innerText = shiftMode ? 'AVG' : 'RND';
        btns.sqrt.innerText = shiftMode ? 'TAX' : '√';
        btns.ac.querySelector('span:first-child').innerText = shiftMode ? 'CLS' : 'CLR';
        btns.ac.classList.toggle('ac-shift', shiftMode);
        document.getElementById('shiftBtn').classList.toggle('shift-active', shiftMode);
        document.getElementById('expBtn').innerHTML = shiftMode ? 'LN' : '<div class="exp-container">e<span class="exp-sup">x</span></div>';
        ['sin','cos','tan'].forEach(f => document.getElementById(f+'Btn').innerText = (shiftMode?'A':'')+f.toUpperCase());
        document.getElementById('mmInBtn').innerText = shiftMode ? 'in→mm' : 'mm→in';
        updateStatus();
    }

    // ============================================================
    // Input Handling (button dispatch)
    // ============================================================
    // Lookup table for what string a button inserts into the entry line, for the
    // handful of buttons whose inserted text isn't just their own data-val (and/or
    // depends on shift mode). Anything not listed here inserts val itself unchanged.
    const INSERT_TOKENS = {
        ans: () => 'ANS',
        root: (shift) => shift ? 'TAX(' : '√(',
        sin: (shift) => (shift ? 'A' : '') + 'SIN(',
        cos: (shift) => (shift ? 'A' : '') + 'COS(',
        tan: (shift) => (shift ? 'A' : '') + 'TAN(',
        exp: (shift) => shift ? 'LN(' : 'e^',
    };
    function getInsertToken(val, shiftMode) {
        return INSERT_TOKENS[val] ? INSERT_TOKENS[val](shiftMode) : val;
    }

    function handleInput(val) {
        if (rndMode && !isNaN(val)) { currentRnd = parseInt(val); localStorage.setItem('vfdRnd', currentRnd); rndMode = false; initHistory(); return; }
        if (val === 'rnd_mode') { if (shiftMode) { let a = 'AVG('; entryArr.splice(cursorIdx, 0, ...a.split('')); cursorIdx += a.length; shiftMode = false; } else rndMode = true; renderEntry(); return; }
        const items = Array.from(document.querySelectorAll('.history-item')).reverse();
        if (val === 'shift') { shiftMode = !shiftMode; renderEntry(); return; }
        if (val === 'ans' && shiftMode) { sciMode = !sciMode; localStorage.setItem('vfdSciMode', sciMode); shiftMode = false; initHistory(); renderEntry(); return; }
        if (val === 'left') { cursorIdx = shiftMode ? 0 : Math.max(0, cursorIdx - 1); shiftMode = false; renderEntry(); return; }
        if (val === 'right') { cursorIdx = shiftMode ? entryArr.length : Math.min(entryArr.length, cursorIdx + 1); shiftMode = false; renderEntry(); return; }
        if (val === 'up') { if (historyIndex < items.length - 1) { historyIndex++; items[historyIndex].scrollIntoView({ behavior: 'smooth', block: 'center' }); } items.forEach((it, i) => it.classList.toggle('selected', i === historyIndex)); renderEntry(); return; }
        if (val === 'down') { if (historyIndex > -1) { historyIndex--; if (historyIndex === -1) viewport.scrollTop = viewport.scrollHeight; else items[historyIndex].scrollIntoView({ behavior: 'smooth', block: 'center' }); } items.forEach((it, i) => it.classList.toggle('selected', i === historyIndex)); renderEntry(); return; }
        if (val === '=') {
            if (historyIndex !== -1) {
                let v = shiftMode ? items[historyIndex].querySelector('span:first-child').innerText : items[historyIndex].getAttribute('data-ans');
                entryArr = []; 
                cursorIdx = 0; 
                historyIndex = -1; 
                items.forEach(it => it.classList.remove('selected'));
                entryArr.splice(0, 0, ...v.toString().split(''));
                cursorIdx = entryArr.length;
                shiftMode = false;
                preErrorEntry = null;
            } else solve();
        } else if (val === 'ac') {
            if (shiftMode) { fullHistory = []; localStorage.removeItem('vfdHistory'); historyContainer.innerHTML = ''; lastAnswer = 0; }
            entryArr = []; cursorIdx = 0; historyIndex = -1; shiftMode = false;
            preErrorEntry = null;
        } else if (val === 'del') {
            if (historyIndex !== -1) { historyIndex = -1; items.forEach(it => it.classList.remove('selected')); }
            if (preErrorEntry) {
                // Right after a failed calculation: restore the expression as it was
                // before '=' was pressed, instead of deleting from the literal "ERROR" text.
                entryArr = preErrorEntry.split('');
                cursorIdx = entryArr.length;
                preErrorEntry = null;
            } else if (cursorIdx > 0) { entryArr.splice(cursorIdx - 1, 1); cursorIdx--; }
        }
        else if (val === 'recip' || val === 'n16' || val === 'mmin') {
            let overrideVal = null;
            if (historyIndex !== -1) {
                overrideVal = items[historyIndex].getAttribute('data-ans');
                historyIndex = -1;
                items.forEach(it => it.classList.remove('selected'));
            }
            if (val === 'recip') instantRecip(overrideVal);
            else if (val === 'n16') instantN16(overrideVal);
            else { instantUnitConvert(overrideVal, !shiftMode); shiftMode = false; }
        }
        else {
            if (historyIndex !== -1) { historyIndex = -1; items.forEach(it => it.classList.remove('selected')); }
            preErrorEntry = null;
            if (val === '-' && entryArr.length === 4 && entryArr.join('') === 'ANS-') {
                // second '-' right after the auto-inserted "ANS-": strip ANS, leave a bare negative sign
                entryArr = ['-']; cursorIdx = 1;
            } else {
                if (entryArr.length === 0 && ['+', '-', '*', '/', '^'].includes(val)) { entryArr = ['A','N','S']; cursorIdx = 3; }
                let t = getInsertToken(val, shiftMode);
                entryArr.splice(cursorIdx, 0, ...t.split('')); cursorIdx += t.length;
            }
            shiftMode = false;
        }
        renderEntry();
    }

    // ============================================================
    // Calculation Actions (delegate the actual math to CalcEngine,
    // then apply the result to history / display state)
    // ============================================================
    function solve() {
        let e = entryArr.join(''); if (!e) return;
        const result = CalcEngine.evaluate(e, { ans: lastAnswer });
        if (result.ok) {
            lastAnswer = result.value;
            fullHistory.push({ expr: e, res: lastAnswer });
            localStorage.setItem('vfdHistory', JSON.stringify(fullHistory));
            initHistory(); entryArr = []; cursorIdx = 0;
        } else {
            preErrorEntry = e;
            entryArr = ['E','R','R','O','R']; cursorIdx = 5;
            showNotif(humanizeCalcError(result.error));
        }
        renderEntry();
    }

    function instantN16(overrideVal) {
        let e = (overrideVal !== null && overrideVal !== undefined) ? overrideVal.toString() : (entryArr.length > 0 ? entryArr.join('') : "ANS");
        const result = CalcEngine.evaluate(e, { ans: lastAnswer });
        if (result.ok) {
            let m = getFractionMatrix(result.value); lastAnswer = m.raw;
            fullHistory.push({ expr: `n/16(${e})`, res: m.res, ind: m.ind, rawRes: m.raw });
            localStorage.setItem('vfdHistory', JSON.stringify(fullHistory));
            initHistory(); entryArr = []; cursorIdx = 0;
        } else {
            preErrorEntry = e;
            entryArr = ['E','R','R','O','R']; cursorIdx = 5;
            showNotif(humanizeCalcError(result.error));
        }
        renderEntry();
    }

    function instantRecip(overrideVal) {
        let e = (overrideVal !== null && overrideVal !== undefined) ? overrideVal.toString() : (entryArr.length > 0 ? entryArr.join('') : "ANS");
        const result = CalcEngine.evaluate(e, { ans: lastAnswer });
        if (result.ok && result.value !== 0) {
            lastAnswer = 1 / result.value;
            fullHistory.push({ expr: `1/(${e})`, res: lastAnswer });
            localStorage.setItem('vfdHistory', JSON.stringify(fullHistory));
            initHistory(); entryArr = []; cursorIdx = 0;
        } else {
            preErrorEntry = e;
            entryArr = ['E','R','R','O','R']; cursorIdx = 5;
            showNotif(result.ok ? 'DIV BY ZERO' : humanizeCalcError(result.error));
        }
        renderEntry();
    }

    function instantUnitConvert(overrideVal, toInches) {
        let e = (overrideVal !== null && overrideVal !== undefined) ? overrideVal.toString() : (entryArr.length > 0 ? entryArr.join('') : "ANS");
        const result = CalcEngine.evaluate(e, { ans: lastAnswer });
        if (result.ok) {
            lastAnswer = toInches ? result.value / 25.4 : result.value * 25.4;
            let label = toInches ? `mm\u2192in(${e})` : `in\u2192mm(${e})`;
            fullHistory.push({ expr: label, res: lastAnswer });
            localStorage.setItem('vfdHistory', JSON.stringify(fullHistory));
            initHistory(); entryArr = []; cursorIdx = 0;
        } else {
            preErrorEntry = e;
            entryArr = ['E','R','R','O','R']; cursorIdx = 5;
            showNotif(humanizeCalcError(result.error));
        }
        renderEntry();
    }

    // On Android, the very first tap on a freshly-loaded page can be consumed by the
    // OS/WebView just to hand input focus to the page, before any subsequent tap is
    // treated as "real" input for gated APIs like vibration. Forcing focus onto the page
    // immediately at load - before any tap happens - means that hand-off is already done,
    // so the first real tap isn't the one doing double duty.
    window.focus();
    document.body.focus();

    // Some mobile browsers silently drop the very first navigator.vibrate() call after
    // page load even on a genuine tap, but every call after that works fine. Firing two
    // throwaway pulses in the capture phase - ahead of the button handler below, within
    // that same first tap - absorbs the dropped call(s) so the real one reliably fires
    // (giving 3 total vibrate() calls on that very first tap: 2 primers + the real one).
    window.addEventListener('pointerdown', () => {
        if (navigator.vibrate) { navigator.vibrate(1); navigator.vibrate(1); }
    }, { capture: true, once: true });

    document.getElementById('main-grid').addEventListener('pointerdown', (e) => {
        const btn = e.target.closest('button'); if (!btn) return;
        const val = btn.getAttribute('data-val');
        triggerHaptic(); isHolding = false;
        if (val === 'ans' || val === '=' || val === 'ac') {
            holdTimer = setTimeout(() => {
                isHolding = true;
                if (val === '=') {
                    const items = Array.from(document.querySelectorAll('.history-item')).reverse();
                    let v;
                    if (historyIndex !== -1) v = parseFloat(items[historyIndex].getAttribute('data-ans'));
                    else if (entryArr.length > 0) { solve(); v = lastAnswer; }
                    if (v !== undefined && !isNaN(v)) {
                        stickyMemory = (parseFloat(stickyMemory) + v).toString();
                        localStorage.setItem('vfdStickyMemory', stickyMemory);
                        showNotif("MEM+"); triggerHaptic(true); updateStatus();
                    }
                } else if (val === 'ans') {
                    entryArr.splice(cursorIdx, 0, ...stickyMemory.split(''));
                    cursorIdx += stickyMemory.length; renderEntry(); triggerHaptic(true);
                } else if (val === 'ac') {
                    if (shiftMode) {
                        stickyMemory = "0"; localStorage.setItem('vfdStickyMemory', stickyMemory);
                        showNotif("MEM CLR"); triggerHaptic(true); updateStatus();
                    } else {
                        const items = Array.from(document.querySelectorAll('.history-item')).reverse();
                        let v;
                        if (historyIndex !== -1) v = parseFloat(items[historyIndex].getAttribute('data-ans'));
                        else if (entryArr.length > 0) { solve(); v = lastAnswer; }
                        if (v !== undefined && !isNaN(v)) {
                            stickyMemory = (parseFloat(stickyMemory) - v).toString();
                            localStorage.setItem('vfdStickyMemory', stickyMemory);
                            showNotif("MEM-"); triggerHaptic(true); updateStatus();
                        }
                    }
                }
            }, 500);
        }
    });

    document.getElementById('main-grid').addEventListener('pointerup', (e) => {
        clearTimeout(holdTimer);
        const btn = e.target.closest('button');
        if (btn && !isHolding) handleInput(btn.getAttribute('data-val'));
    });

    // Physical keyboard -> calculator keys.
    document.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        let val = null;
        if (/^[0-9.+\-*\/]$/.test(e.key)) val = e.key;
        else if (e.key === 'Enter') val = '=';
        else if (e.key === 'Backspace') val = 'del';
        if (val === null) return;
        e.preventDefault();
        handleInput(val);
    });

    // Width overlay: shows the app width while the window is being resized.
    const sizeTag = document.getElementById('size-overlay');
    function showSize() { sizeTag.textContent = Math.round(document.body.getBoundingClientRect().width) + ' px'; }
    window.addEventListener('resize', showSize);
    showSize();

    initHistory(); renderEntry();
</script>
</body>
</html>
